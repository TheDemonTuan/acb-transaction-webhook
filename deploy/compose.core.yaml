name: acb-core

services:
  worker:
    image: ${WORKER_IMAGE_REF:-ghcr.io/thedemontuan/acb-transaction-webhook-worker:latest}
    container_name: acb-worker
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DATABASE_PATH: /data/gateway.db
      TZ: Asia/Ho_Chi_Minh
      WORKER_RPC_ADDR: 0.0.0.0:8190
      WORKER_INTERNAL_TOKEN_FILE: /run/secrets/worker_internal_token
      APP_MASTER_KEY_FILE: /run/secrets/app_master_key
      POLL_MIN_INTERVAL_SEC: ${POLL_MIN_INTERVAL_SEC:-3}
      POLL_MAX_INTERVAL_SEC: ${POLL_MAX_INTERVAL_SEC:-10}
      CLOUDFLARE_ACCESS_TEAM_NAME: ${CLOUDFLARE_ACCESS_TEAM_NAME:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:-https://${CLOUDFLARE_ACCESS_TEAM_NAME:-your-team}.cloudflareaccess.com}
      CF_ACCESS_AUDIENCE: ${CF_ACCESS_AUDIENCE:-${CLOUDFLARE_ACCESS_AUD:-}}
      CF_ACCESS_JWKS_URL: ${CF_ACCESS_JWKS_URL:-https://${CLOUDFLARE_ACCESS_TEAM_NAME:-your-team}.cloudflareaccess.com/cdn-cgi/access/certs}
      OWNER_SUBJECTS: ${OWNER_SUBJECTS:-${CLOUDFLARE_ACCESS_OWNER_EMAIL:-}}
      AUTH_BROWSER_URL: http://auth-browser:8181
      AUTH_BROWSER_VNC_URL: http://auth-browser:6080
      TTS_GATEWAY_URL: http://tts-gateway:8081
      TTS_INTERNAL_TOKEN_FILE: /run/secrets/tts_internal_token
      BARK_SERVER_URL: http://bark:8080
      BARK_PUBLIC_URL: ${BARK_PUBLIC_URL:-https://bark.tuannguyenviet.site}
      BARK_BASIC_AUTH_USER_FILE: /run/secrets/bark_basic_auth_user
      BARK_BASIC_AUTH_PASSWORD_FILE: /run/secrets/bark_basic_auth_password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://bank.tuannguyenviet.site}
    expose:
      - "8190"
    networks:
      acb-core:
        aliases:
          - worker
          - acb-worker
      acb-egress:
    volumes:
      - gateway_data:/data
    secrets:
      - app_master_key
      - tts_internal_token
      - worker_internal_token
      - bark_basic_auth_user
      - bark_basic_auth_password
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 100

  auth-browser:
    image: ${BROWSER_IMAGE_REF:-ghcr.io/thedemontuan/acb-transaction-webhook-auth-browser:latest}
    container_name: acb-auth-browser
    restart: unless-stopped
    init: true
    read_only: false
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-auth-browser.json
    environment:
      APP_ENV: production
      PORT: 8181
      NOVNC_PORT: 6080
      DISPLAY: :99
      SCREEN_WIDTH: 1280
      SCREEN_HEIGHT: 800
      SCREEN_DEPTH: 24
      TZ: Asia/Ho_Chi_Minh
    expose:
      - "8181"
      - "6080"
    networks:
      acb-core:
        aliases:
          - auth-browser
      acb-egress:
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/appuser/.config:rw,noexec,nosuid,size=64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
          pids: 300

  tts-gateway:
    image: ${TTS_IMAGE_REF:-ghcr.io/thedemontuan/acb-transaction-webhook-tts-gateway:latest}
    container_name: acb-tts-gateway
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PORT: 8081
      TZ: Asia/Ho_Chi_Minh
      TTS_INTERNAL_TOKEN_FILE: /run/secrets/tts_internal_token
    expose:
      - "8081"
    networks:
      acb-core:
        aliases:
          - tts-gateway
      acb-egress:
    secrets:
      - tts_internal_token
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 100

  bark:
    image: ${BARK_IMAGE_REF:-ghcr.io/finb/bark-server:latest}
    container_name: acb-bark
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "/bark-entrypoint.sh"]
    command: ["bark-server"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      BARK_KEY: ""
      BARK_SERVER_ADDRESS: 0.0.0.0:8080
      BARK_SERVER_DATA_DIR: /data
      BARK_SERVER_REDUCE_MEMORY_USAGE: "true"
    expose:
      - "8080"
    networks:
      acb-core:
        aliases:
          - bark
      acb-egress:
      edge-acb:
        aliases:
          - acb-bark
    volumes:
      - bark_data:/data
      - ./bark-entrypoint.sh:/bark-entrypoint.sh:ro
    secrets:
      - bark_basic_auth_user
      - bark_basic_auth_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
          pids: 100

volumes:
  gateway_data:
    external: true
    name: bank-event-gateway_gateway_data
  bark_data:
    external: true
    name: bank-event-gateway_bark_data

networks:
  acb-core:
    external: true
    name: acb-core
  acb-egress:
    external: true
    name: acb-egress
  edge-acb:
    external: true
    name: edge-acb

secrets:
  app_master_key:
    file: ./secrets/app_master_key
  tts_internal_token:
    file: ./secrets/tts_internal_token
  worker_internal_token:
    file: ./secrets/worker_internal_token
  bark_basic_auth_user:
    file: ./secrets/bark_basic_auth_user
  bark_basic_auth_password:
    file: ./secrets/bark_basic_auth_password
