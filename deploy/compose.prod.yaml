name: acb

services:
  worker:
    image: ${WORKER_IMAGE_REF:?WORKER_IMAGE_REF is required}
    container_name: acb-worker
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      RUNTIME_ROLE: worker
      DATABASE_PATH: /data/gateway.db
      TZ: Asia/Ho_Chi_Minh
      WORKER_RPC_ADDR: 0.0.0.0:8190
      WORKER_INTERNAL_TOKEN_FILE: /run/secrets/worker_internal_token
      APP_MASTER_KEY_FILE: /run/secrets/app_master_key
      POLL_MIN_INTERVAL_SEC: ${POLL_MIN_INTERVAL_SEC:-3}
      POLL_MAX_INTERVAL_SEC: ${POLL_MAX_INTERVAL_SEC:-10}
      AUTH_BROWSER_URL: http://auth-browser:8181
      AUTH_BROWSER_VNC_URL: http://auth-browser:6080
      BARK_SERVER_URL: http://bark:8080
      BARK_PUBLIC_URL: ${BARK_PUBLIC_URL:-https://bark.tuannguyenviet.site}
      BARK_BASIC_AUTH_USER_FILE: /run/secrets/bark_basic_auth_user
      BARK_BASIC_AUTH_PASSWORD_FILE: /run/secrets/bark_basic_auth_password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://bank.tuannguyenviet.site}
    expose:
      - "8190"
    networks:
      acb-core:
        aliases:
          - worker
          - acb-worker
      acb-egress:
    volumes:
      - gateway_data:/data
    secrets:
      - app_master_key
      - worker_internal_token
      - bark_basic_auth_user
      - bark_basic_auth_password
    stop_grace_period: 30s
    labels:
      - "platform.workload.class=singleton"
    healthcheck:
      test: ["CMD", "/worker", "--liveness-check"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    cpus: "0.75"
    mem_limit: 512M
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 100

  auth-browser:
    image: ${BROWSER_IMAGE_REF:?BROWSER_IMAGE_REF is required}
    container_name: acb-auth-browser
    restart: unless-stopped
    init: true
    read_only: false
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-auth-browser.json
    environment:
      APP_ENV: production
      PORT: 8181
      NOVNC_PORT: 6080
      DISPLAY: :99
      SCREEN_WIDTH: 1280
      SCREEN_HEIGHT: 800
      SCREEN_DEPTH: 24
      TZ: Asia/Ho_Chi_Minh
    expose:
      - "8181"
      - "6080"
    networks:
      acb-core:
        aliases:
          - auth-browser
      acb-egress:
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/gateway/.config:rw,noexec,nosuid,size=64m
      - /home/appuser/.config:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "/auth-browser", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    cpus: "1.50"
    mem_limit: 1536M
    pids_limit: 300
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
          pids: 300

  tts-gateway:
    image: ${TTS_IMAGE_REF:?TTS_IMAGE_REF is required}
    container_name: acb-tts-gateway
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PORT: 8081
      TZ: Asia/Ho_Chi_Minh
      TTS_INTERNAL_TOKEN_FILE: /run/secrets/tts_internal_token
    expose:
      - "8081"
    networks:
      acb-core:
        aliases:
          - tts-gateway
      acb-egress:
    secrets:
      - tts_internal_token
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: "0.50"
    mem_limit: 384M
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 100

  bark:
    image: ${BARK_IMAGE_REF:?BARK_IMAGE_REF is required}
    container_name: acb-bark
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "/bark-entrypoint.sh"]
    command: ["--addr", "0.0.0.0:8080", "--data", "/data"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      BARK_KEY: ""
      BARK_SERVER_REDUCE_MEMORY_USAGE: "true"
    expose:
      - "8080"
    networks:
      acb-core:
        aliases:
          - bark
      acb-egress:
      edge-acb:
        aliases:
          - acb-bark
    volumes:
      - bark_data:/data
      - ./bark-entrypoint.sh:/bark-entrypoint.sh:ro
    secrets:
      - bark_basic_auth_user
      - bark_basic_auth_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: "0.25"
    mem_limit: 192M
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
          pids: 100

  gateway-blue:
    image: ${IMAGE_REF_BLUE:?IMAGE_REF_BLUE is required}
    container_name: acb-gateway-blue
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      RUNTIME_ROLE: gateway
      PLATFORM_SLOT: blue
      RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
      PORT: 8090
      LISTEN_ADDR: 0.0.0.0:8090
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://bank.tuannguyenviet.site}
      DATA_DIR: /data
      DATABASE_PATH: /data/gateway.db
      TZ: Asia/Ho_Chi_Minh
      APP_MASTER_KEY_FILE: /run/secrets/app_master_key
      WORKER_RPC_URL: http://acb-worker:8190
      WORKER_INTERNAL_TOKEN_FILE: /run/secrets/worker_internal_token
      AUTH_BROWSER_URL: http://auth-browser:8181
      AUTH_BROWSER_VNC_URL: http://auth-browser:6080
      TTS_GATEWAY_URL: http://tts-gateway:8081
      TTS_INTERNAL_TOKEN_FILE: /run/secrets/tts_internal_token
    expose:
      - "8090"
    networks:
      edge-acb:
        aliases:
          - acb-web-blue
      acb-core:
      acb-egress:
    volumes:
      - gateway_data:/data
    secrets:
      - app_master_key
      - tts_internal_token
      - worker_internal_token
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge-acb"
      - "traefik.http.routers.acb-blue.entrypoints=slot-probe"
      - "traefik.http.routers.acb-blue.rule=Host(`acb-blue.internal.invalid`)"
      - "traefik.http.services.acb-blue.loadbalancer.server.port=8090"
      - "traefik.http.services.acb-blue.loadbalancer.healthcheck.path=/readyz"
      - "traefik.http.services.acb-blue.loadbalancer.healthcheck.interval=3s"
      - "traefik.http.services.acb-blue.loadbalancer.healthcheck.timeout=1s"
      - "platform.failover.enabled=true"
      - "platform.failover.app=acb"
      - "platform.failover.slot=blue"
      - "platform.failover.peer=acb-gateway-green"
      - "platform.workload.class=http"
      - "platform.failover.mode=warm"
    healthcheck:
      test: ["CMD", "/gateway", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: "0.75"
    mem_limit: 512M
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 100

  gateway-green:
    image: ${IMAGE_REF_GREEN:?IMAGE_REF_GREEN is required}
    container_name: acb-gateway-green
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      RUNTIME_ROLE: gateway
      PLATFORM_SLOT: green
      RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
      PORT: 8090
      LISTEN_ADDR: 0.0.0.0:8090
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://bank.tuannguyenviet.site}
      DATA_DIR: /data
      DATABASE_PATH: /data/gateway.db
      TZ: Asia/Ho_Chi_Minh
      APP_MASTER_KEY_FILE: /run/secrets/app_master_key
      WORKER_RPC_URL: http://acb-worker:8190
      WORKER_INTERNAL_TOKEN_FILE: /run/secrets/worker_internal_token
      AUTH_BROWSER_URL: http://auth-browser:8181
      AUTH_BROWSER_VNC_URL: http://auth-browser:6080
      TTS_GATEWAY_URL: http://tts-gateway:8081
      TTS_INTERNAL_TOKEN_FILE: /run/secrets/tts_internal_token
    expose:
      - "8090"
    networks:
      edge-acb:
        aliases:
          - acb-web-green
      acb-core:
      acb-egress:
    volumes:
      - gateway_data:/data
    secrets:
      - app_master_key
      - tts_internal_token
      - worker_internal_token
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge-acb"
      - "traefik.http.routers.acb-green.entrypoints=slot-probe"
      - "traefik.http.routers.acb-green.rule=Host(`acb-green.internal.invalid`)"
      - "traefik.http.services.acb-green.loadbalancer.server.port=8090"
      - "traefik.http.services.acb-green.loadbalancer.healthcheck.path=/readyz"
      - "traefik.http.services.acb-green.loadbalancer.healthcheck.interval=3s"
      - "traefik.http.services.acb-green.loadbalancer.healthcheck.timeout=1s"
      - "platform.failover.enabled=true"
      - "platform.failover.app=acb"
      - "platform.failover.slot=green"
      - "platform.failover.peer=acb-gateway-blue"
      - "platform.workload.class=http"
      - "platform.failover.mode=warm"
    healthcheck:
      test: ["CMD", "/gateway", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: "0.75"
    mem_limit: 512M
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 100

  dbtool:
    image: ${DBTOOL_IMAGE_REF:?DBTOOL_IMAGE_REF is required}
    container_name: acb-dbtool
    profiles:
      - tools
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_PATH: /data/gateway.db
    volumes:
      - gateway_data:/data
    networks:
      - none
    cpus: "0.50"
    mem_limit: 256M
    pids_limit: 50
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 50

volumes:
  gateway_data:
    external: true
    name: ${DATA_VOLUME_NAME:-bank-event-gateway_gateway_data}
  bark_data:
    external: true
    name: ${BARK_VOLUME_NAME:-bank-event-gateway_bark_data}

networks:
  edge-acb:
    external: true
    name: edge-acb
  acb-core:
    external: true
    name: acb-core
  acb-egress:
    external: true
    name: acb-egress
  none:
    internal: true

secrets:
  app_master_key:
    file: ./secrets/app_master_key
  tts_internal_token:
    file: ./secrets/tts_internal_token
  worker_internal_token:
    file: ./secrets/worker_internal_token
  bark_basic_auth_user:
    file: ./secrets/bark_basic_auth_user
  bark_basic_auth_password:
    file: ./secrets/bark_basic_auth_password
