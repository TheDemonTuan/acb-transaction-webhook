name: acb-transaction-webhook

services:
  gateway:
    image: ${IMAGE_REF:-ghcr.io/thedemontuan/acb-transaction-webhook:latest}
    container_name: acb-transaction-gateway
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      APP_ENV: production
      PORT: ${PORT:-8090}
      LISTEN_ADDR: 0.0.0.0:8090
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://bank.tuannguyenviet.site}
      DATA_DIR: /data
      DATABASE_PATH: /data/gateway.db
      TZ: Asia/Ho_Chi_Minh
      APP_MASTER_KEY: ${APP_MASTER_KEY:-}
      APP_MASTER_KEY_FILE: ${APP_MASTER_KEY_FILE:-/run/secrets/app_master_key}
      POLL_MIN_INTERVAL_SEC: ${POLL_MIN_INTERVAL_SEC:-3}
      POLL_MAX_INTERVAL_SEC: ${POLL_MAX_INTERVAL_SEC:-10}
      CLOUDFLARE_ACCESS_TEAM_NAME: ${CLOUDFLARE_ACCESS_TEAM_NAME:-}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:-}
      CF_ACCESS_ISSUER: ${CF_ACCESS_ISSUER:-https://${CLOUDFLARE_ACCESS_TEAM_NAME:-your-team}.cloudflareaccess.com}
      CF_ACCESS_AUDIENCE: ${CF_ACCESS_AUDIENCE:-${CLOUDFLARE_ACCESS_AUD:-}}
      CF_ACCESS_JWKS_URL: ${CF_ACCESS_JWKS_URL:-https://${CLOUDFLARE_ACCESS_TEAM_NAME:-your-team}.cloudflareaccess.com/cdn-cgi/access/certs}
      OWNER_SUBJECTS: ${OWNER_SUBJECTS:-${CLOUDFLARE_ACCESS_OWNER_EMAIL:-}}
      AUTH_BROWSER_URL: http://auth-browser:8181
      AUTH_BROWSER_VNC_URL: http://auth-browser:6080
      TTS_GATEWAY_URL: http://tts-gateway:8081
      TTS_INTERNAL_TOKEN_FILE: /run/secrets/tts_internal_token
      BARK_SERVER_URL: ${BARK_SERVER_URL:-http://bark:8080}
      BARK_PUBLIC_URL: ${BARK_PUBLIC_URL:-https://bark.tuannguyenviet.site}
      BARK_BASIC_AUTH_USER_FILE: /run/secrets/bark_basic_auth_user
      BARK_BASIC_AUTH_PASSWORD_FILE: /run/secrets/bark_basic_auth_password
    expose:
      - "8090"
    networks:
      default:
      edge:
        aliases:
          - acb-web
    volumes:
      - gateway_data:/data:rw
      - ./secrets/app_master_key:/run/secrets/app_master_key:ro
      - ./secrets/tts_internal_token:/run/secrets/tts_internal_token:ro
      - ./secrets/bark_basic_auth_user:/run/secrets/bark_basic_auth_user:ro
      - ./secrets/bark_basic_auth_password:/run/secrets/bark_basic_auth_password:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    healthcheck:
      test: ["CMD", "/gateway", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    pids_limit: 100
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth-browser:
    image: ${AUTH_BROWSER_IMAGE_REF:-ghcr.io/thedemontuan/acb-transaction-webhook-auth-browser:latest}
    container_name: acb-auth-browser
    restart: unless-stopped
    init: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-auth-browser.json
    environment:
      HOME: /tmp
    expose: ["8181", "6080"]
    networks:
      - default
    healthcheck:
      test: ["CMD", "/auth-browser", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g,mode=1777
    pids_limit: 300
    mem_limit: 1536m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tts-gateway:
    image: ${TTS_GATEWAY_IMAGE_REF:-ghcr.io/thedemontuan/acb-transaction-webhook-tts-gateway:latest}
    container_name: acb-tts-gateway
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TTS_HOST: 0.0.0.0
      TTS_PORT: 8081
      TZ: Asia/Ho_Chi_Minh
      TTS_INTERNAL_TOKEN_FILE: /run/secrets/tts_internal_token
      TTS_REQUIRE_AUTH: "true"
    expose:
      - "8081"
    networks:
      default:
    volumes:
      - ./secrets/tts_internal_token:/run/secrets/tts_internal_token:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    pids_limit: 50
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bark:
    image: ${BARK_IMAGE_REF:?BARK_IMAGE_REF must be an immutable digest}
    container_name: acb-bark
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "/bark-entrypoint.sh"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      BARK_SERVER_ADDRESS: 0.0.0.0:8080
      BARK_SERVER_DATA_DIR: /data
      BARK_SERVER_REDUCE_MEMORY_USAGE: "true"
    expose:
      - "8080"
    networks:
      default:
        aliases:
          - bark
      edge:
        aliases:
          - acb-bark
    volumes:
      - bark_data:/data:rw
      - ./bark-entrypoint.sh:/bark-entrypoint.sh:ro
      - ./secrets/bark_basic_auth_user:/run/secrets/bark_basic_auth_user:ro
      - ./secrets/bark_basic_auth_password:/run/secrets/bark_basic_auth_password:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    pids_limit: 50
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    internal: false
  edge:
    external: true
    name: edge-acb

volumes:
  gateway_data:
    name: bank-event-gateway_gateway_data
  bark_data:
    name: bank-event-gateway_bark_data
