services:
  dbtool:
    image: ${DBTOOL_IMAGE_REF:?DBTOOL_IMAGE_REF is required}
    container_name: acb-dbtool
    profiles:
      - tools
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_PATH: /data/gateway.db
    volumes:
      - gateway_data:/data
    networks:
      - none
    cpus: "0.50"
    mem_limit: 256M
    pids_limit: 50
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 50
