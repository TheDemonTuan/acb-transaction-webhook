services:
  bark:
    image: ${BARK_IMAGE_REF:?BARK_IMAGE_REF is required}
    container_name: acb-bark
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    group_add:
      - "${BARK_SECRET_GROUP:-0}"
    entrypoint: ["/bin/sh", "/bark-entrypoint.sh"]
    command: ["--addr", "0.0.0.0:8080", "--data", "/data"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      BARK_KEY: ""
      BARK_SERVER_REDUCE_MEMORY_USAGE: "true"
    expose:
      - "8080"
    networks:
      acb-core:
        aliases:
          - bark
      acb-egress:
      edge-acb:
        aliases:
          - acb-bark
    volumes:
      - bark_data:/data
      - ./bark-entrypoint.sh:/bark-entrypoint.sh:ro
    secrets:
      - bark_basic_auth_user
      - bark_basic_auth_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: "0.25"
    mem_limit: 192M
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192M
          pids: 100
