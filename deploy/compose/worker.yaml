services:
  worker:
    image: ${WORKER_IMAGE_REF:?WORKER_IMAGE_REF is required}
    container_name: acb-worker
    restart: unless-stopped
    init: true
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      RUNTIME_ROLE: worker
      DATABASE_PATH: /data/gateway.db
      TZ: Asia/Ho_Chi_Minh
      WORKER_RPC_ADDR: 0.0.0.0:8190
      WORKER_REALTIME_ADDR: 0.0.0.0:8191
      WORKER_INTERNAL_TOKEN_FILE: /run/secrets/worker_internal_token
      APP_MASTER_KEY_FILE: /run/secrets/app_master_key
      POLL_MIN_INTERVAL_SEC: ${POLL_MIN_INTERVAL_SEC:-3}
      POLL_MAX_INTERVAL_SEC: ${POLL_MAX_INTERVAL_SEC:-10}
      BARK_SERVER_URL: http://bark:8080
      BARK_PUBLIC_URL: ${BARK_PUBLIC_URL:-https://bark.tuannguyenviet.site}
      BARK_BASIC_AUTH_USER_FILE: /run/secrets/bark_basic_auth_user
      BARK_BASIC_AUTH_PASSWORD_FILE: /run/secrets/bark_basic_auth_password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://bank.tuannguyenviet.site}
    expose:
      - "8190"
      - "8191"
    networks:
      acb-core:
        aliases:
          - worker
          - acb-worker
      acb-egress:
    volumes:
      - gateway_data:/data
    secrets:
      - app_master_key
      - worker_internal_token
      - bark_basic_auth_user
      - bark_basic_auth_password
    stop_grace_period: 30s
    labels:
      - "platform.workload.class=singleton"
    healthcheck:
      test: ["CMD", "/worker", "--readiness-check"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    cpus: "0.75"
    mem_limit: 512M
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
          pids: 100
