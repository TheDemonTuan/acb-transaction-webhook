services:
  auth-browser:
    image: ${BROWSER_IMAGE_REF:?BROWSER_IMAGE_REF is required}
    container_name: acb-auth-browser
    restart: unless-stopped
    init: true
    read_only: false
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp-auth-browser.json
    environment:
      APP_ENV: production
      PORT: 8181
      NOVNC_PORT: 6080
      DISPLAY: :99
      SCREEN_WIDTH: 1280
      SCREEN_HEIGHT: 800
      SCREEN_DEPTH: 24
      TZ: Asia/Ho_Chi_Minh
      AUTH_BROWSER_INTERNAL_TOKEN_FILE: /run/secrets/auth_browser_internal_token
    expose:
      - "8181"
      - "6080"
    secrets:
      - auth_browser_internal_token
    networks:
      acb-core:
        aliases:
          - auth-browser
      acb-egress:
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /home/gateway/.config:rw,noexec,nosuid,size=64m
      - /home/appuser/.config:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "/auth-browser", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    cpus: "1.50"
    mem_limit: 1536M
    pids_limit: 300
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
          pids: 300
