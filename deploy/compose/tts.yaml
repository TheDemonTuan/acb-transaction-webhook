services:
  tts-gateway:
    image: ${TTS_IMAGE_REF:?TTS_IMAGE_REF is required}
    container_name: acb-tts-gateway
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PORT: 8081
      TZ: Asia/Ho_Chi_Minh
      TTS_INTERNAL_TOKEN_FILE: /run/secrets/tts_internal_token
    expose:
      - "8081"
    networks:
      acb-core:
        aliases:
          - tts-gateway
      acb-egress:
    secrets:
      - tts_internal_token
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    cpus: "0.50"
    mem_limit: 384M
    pids_limit: 100
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
          pids: 100
