http:
  routers:
    # Explicit higher-priority deny router blocking /internal endpoints from public ingress
    bark-deny-internal:
      rule: "Host(`bark.tuannguyenviet.site`) && PathPrefix(`/internal`)"
      entryPoints:
        - web
      priority: 1000
      middlewares:
        - deny-internal
      service: bark-service

    # Production router with explicit PathPrefix exclusion
    bark-router:
      rule: "Host(`bark.tuannguyenviet.site`) && !PathPrefix(`/internal`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - tunnel-only
        - security-headers
      service: bark-service

  services:
    bark-service:
      loadBalancer:
        passHostHeader: true
        responseForwarding:
          flushInterval: "100ms"
        servers:
          - url: "http://acb-bark:8080"
        healthCheck:
          path: "/ping"
          interval: "10s"
          timeout: "3s"
