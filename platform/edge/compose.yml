name: edge-traefik

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: edge-docker-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    environment:
      # Read-only API filtering: allow only essential discovery APIs
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      # Deny all mutation, logs, exec, and broad cluster queries
      POST: 0
      EXEC: 0
      NETWORKS: 0
      VOLUMES: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      PLUGINS: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks:
      edge-management:
        aliases:
          - socket-proxy
    security_opt:
      - no-new-privileges:true

  traefik:
    image: traefik:v3.7.13
    container_name: edge-traefik
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: Asia/Ho_Chi_Minh
      DOCKER_API_VERSION: "1.44"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
    networks:
      edge-cf-ingress:
        ipv4_address: 172.31.250.4
      edge-management:
      edge-acb:
    depends_on:
      - socket-proxy

networks:
  edge-management:
    internal: true
  edge-cf-ingress:
    external: true
    name: edge-cf-ingress
  edge-acb:
    external: true
    name: edge-acb
