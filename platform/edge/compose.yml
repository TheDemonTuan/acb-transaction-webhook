name: edge-traefik

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: edge-cloudflared
    restart: unless-stopped
    user: "1000:1000"
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel-token
    secrets:
      - tunnel-token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.25
    networks:
      edge-egress:
        gw_priority: 1
      edge-cf-ingress:
        ipv4_address: 172.31.250.2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: edge-docker-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    environment:
      # Read-only API filtering: allow only essential discovery APIs
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      # Deny all mutation, logs, exec, and broad cluster queries
      POST: 0
      EXEC: 0
      NETWORKS: 0
      VOLUMES: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      PLUGINS: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks:
      edge-management:
        aliases:
          - socket-proxy
    security_opt:
      - no-new-privileges:true

  traefik:
    image: traefik:v3.7.13
    container_name: edge-traefik
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: Asia/Ho_Chi_Minh
      DOCKER_API_VERSION: "1.44"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
    networks:
      edge-cf-ingress:
        ipv4_address: 172.31.250.4
      edge-management:
      edge-acb:
    depends_on:
      - socket-proxy

secrets:
  tunnel-token:
    file: ./secrets/tunnel-token

networks:
  edge-management:
    internal: true
  edge-cf-ingress:
    external: true
    name: edge-cf-ingress
  edge-egress:
    external: true
    name: edge-egress
  edge-acb:
    external: true
    name: edge-acb
