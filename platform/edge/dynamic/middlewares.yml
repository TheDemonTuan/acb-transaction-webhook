http:
  middlewares:
    # Restrict ingress only to Cloudflare Tunnel connector IP
    tunnel-only:
      ipAllowList:
        sourceRange:
          - "172.31.250.2/32"
        rejectStatusCode: 403

    # Security headers
    security-headers:
      headers:
        sslRedirect: false
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Content-Security-Policy: "default-src 'self'; base-uri 'none'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; script-src 'self' https://static.cloudflareinsights.com; script-src-elem 'self' https://static.cloudflareinsights.com 'unsafe-inline'; script-src-attr 'none'; connect-src 'self' ws: wss: https://cloudflareinsights.com; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'"

    # Higher-priority deny for internal/debug endpoints from edge ingress
    deny-internal:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"
        rejectStatusCode: 403

    # Fix previous Caddy bug: Allow GET, POST, PUT, DELETE, HEAD, OPTIONS
    # (Enabling voice settings PUT, notification channels PUT, and QR delete)
    acb-method-filter:
      headers:
        allowedHosts:
          - "bank.tuannguyenviet.site"
