http:
  routers:
    portfolio-router:
      rule: "Host(`tuannguyenviet.site`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - tunnel-only
        - security-headers
      service: portfolio-service

  services:
    portfolio-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://portfolio-web:8080"
        healthCheck:
          path: "/healthz"
          interval: "5s"
          timeout: "2s"
