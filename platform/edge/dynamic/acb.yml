http:
  routers:
    # Explicit higher-priority deny router blocking /internal endpoints from public ingress
    acb-deny-internal:
      rule: "(Host(`bank.tuannguyenviet.site`) || Host(`transactions.tuannguyenviet.site`)) && PathPrefix(`/internal`)"
      entryPoints:
        - web
      priority: 1000
      middlewares:
        - deny-internal
      service: acb-service

    # Deny all private/admin namespaces and health endpoints on public viewer hostname
    acb-public-deny-private:
      rule: "Host(`transactions.tuannguyenviet.site`) && (PathPrefix(`/api`) || PathPrefix(`/internal`) || PathPrefix(`/admin`) || Path(`/health`) || Path(`/healthz`) || Path(`/ready`) || Path(`/readyz`))"
      entryPoints:
        - web
      priority: 1000
      middlewares:
        - deny-internal
      service: acb-service

    # Public SSE router with reconnection and inflight limiting
    acb-public-sse-router:
      rule: "Host(`transactions.tuannguyenviet.site`) && (Path(`/api/public/v1/events`) || Path(`/api/public/v1/events/stream`))"
      entryPoints:
        - web
      priority: 1200
      middlewares:
        - tunnel-only
        - public-sse-rate-limit
        - public-sse-inflight-ip
        - public-sse-inflight-global
        - security-headers
      service: acb-service

    # Public Payment QR activation router with strict rate limiting
    acb-public-activation-router:
      rule: "Host(`transactions.tuannguyenviet.site`) && Path(`/api/public/v1/payment-qr/activate`)"
      entryPoints:
        - web
      priority: 1150
      middlewares:
        - tunnel-only
        - public-activation-rate-limit
        - public-api-inflight-ip
        - public-api-inflight-global
        - security-headers
      service: acb-service

    # Public API router with rate and inflight limiting
    acb-public-api-router:
      rule: "Host(`transactions.tuannguyenviet.site`) && (Path(`/api/public/v1`) || PathPrefix(`/api/public/v1/`))"
      entryPoints:
        - web
      priority: 1100
      middlewares:
        - tunnel-only
        - public-api-rate-limit
        - public-api-inflight-ip
        - public-api-inflight-global
        - security-headers
      service: acb-service

    # Authenticated API router on bank hostname
    acb-api-router:
      rule: "Host(`bank.tuannguyenviet.site`) && (PathPrefix(`/api`) || Path(`/health`) || Path(`/healthz`) || Path(`/ready`) || Path(`/readyz`))"
      entryPoints:
        - web
      priority: 200
      middlewares:
        - tunnel-only
        - security-headers
      service: acb-service

    # Public frontend router on transactions hostname
    acb-public-frontend-router:
      rule: "Host(`transactions.tuannguyenviet.site`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - tunnel-only
        - security-headers
      service: acb-frontend-service

    # Frontend router on bank hostname
    acb-frontend-router:
      rule: "Host(`bank.tuannguyenviet.site`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - tunnel-only
        - security-headers
      service: acb-frontend-service

  services:
    acb-frontend-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://acb-frontend:8080"
        healthCheck:
          path: "/readyz"
          interval: "5s"
          timeout: "2s"

    acb-service:
      loadBalancer:
        passHostHeader: true
        responseForwarding:
          flushInterval: "100ms"
        servers:
          - url: "http://acb-web-blue:8090"
        healthCheck:
          path: "/readyz"
          interval: "5s"
          timeout: "2s"
