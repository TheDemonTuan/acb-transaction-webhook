http:
  routers:
    # Explicit higher-priority deny router blocking /internal endpoints from public ingress
    acb-deny-internal:
      rule: "(Host(`bank.tuannguyenviet.site`) || Host(`transactions.tuannguyenviet.site`)) && PathPrefix(`/internal`)"
      entryPoints:
        - web
      priority: 1000
      middlewares:
        - deny-internal
      service: acb-service

    # Deny all private/admin namespaces and health endpoints on public viewer hostname
    acb-public-deny-private:
      rule: "Host(`transactions.tuannguyenviet.site`) && (PathPrefix(`/api`) || PathPrefix(`/internal`) || PathPrefix(`/admin`) || Path(`/health`) || Path(`/healthz`) || Path(`/ready`) || Path(`/readyz`))"
      entryPoints:
        - web
      priority: 1000
      middlewares:
        - deny-internal
      service: acb-service

    # Only the exact signed provider callback bypasses the public API deny.
    acb-payos-webhook-router:
      rule: "Host(`transactions.tuannguyenviet.site`) && Path(`/api/integrations/payos/webhook`) && Method(`POST`)"
      entryPoints: [web]
      priority: 1150
      middlewares: [tunnel-only, security-headers, payment-privacy, payos-webhook-rate-limit, payos-webhook-body-limit]
      service: acb-service

    acb-public-payments-router:
      rule: "Host(`transactions.tuannguyenviet.site`) && (Path(`/api/public/v1/payment-config`) || Path(`/api/public/v1/payments`) || PathPrefix(`/api/public/v1/payments/`))"
      entryPoints: [web]
      priority: 1120
      middlewares: [tunnel-only, public-api-rate-limit, public-api-inflight-ip, public-api-inflight-global, security-headers, payment-privacy]
      observability:
        accessLogs: false
      service: acb-service

    # Public SSE router with reconnection and inflight limiting
    acb-public-sse-router:
      rule: "Host(`transactions.tuannguyenviet.site`) && (Path(`/api/public/v1/events`) || Path(`/api/public/v1/events/stream`))"
      entryPoints:
        - web
      priority: 1200
      middlewares:
        - tunnel-only
        - public-sse-rate-limit
        - public-sse-inflight-ip
        - public-sse-inflight-global
        - security-headers
      service: acb-service

    # Public API router with rate and inflight limiting
    acb-public-api-router:
      rule: "Host(`transactions.tuannguyenviet.site`) && (Path(`/api/public/v1`) || PathPrefix(`/api/public/v1/`))"
      entryPoints:
        - web
      priority: 1100
      middlewares:
        - tunnel-only
        - public-api-rate-limit
        - public-api-inflight-ip
        - public-api-inflight-global
        - security-headers
      service: acb-service

    # Authenticated API router on bank hostname
    acb-api-router:
      rule: "Host(`bank.tuannguyenviet.site`) && (PathPrefix(`/api`) || Path(`/health`) || Path(`/healthz`) || Path(`/ready`) || Path(`/readyz`))"
      entryPoints:
        - web
      priority: 200
      middlewares:
        - tunnel-only
        - security-headers
      service: acb-service

    acb-admin-payments-router:
      rule: "Host(`bank.tuannguyenviet.site`) && (Path(`/api/v1/payments`) || PathPrefix(`/api/v1/payments/`) || Path(`/api/public/v1/payment-config`) || Path(`/api/public/v1/payments`) || PathPrefix(`/api/public/v1/payments/`))"
      entryPoints: [web]
      priority: 210
      middlewares: [tunnel-only, security-headers, payment-privacy]
      observability:
        accessLogs: false
      service: acb-service

    acb-deploy-gateway:
      rule: "Host(`gateway-deploy.acb.internal.invalid`) && Path(`/readyz`)"
      entryPoints: [slot-probe]
      service: acb-service

  middlewares:
    # Keep cutover policies in the application route bundle, not shared edge files.
    payment-privacy:
      headers:
        customResponseHeaders:
          Referrer-Policy: "no-referrer"
          Cache-Control: "no-store"
    payos-webhook-body-limit:
      buffering:
        maxRequestBodyBytes: 65536
        memRequestBodyBytes: 65536
    payos-webhook-rate-limit:
      rateLimit:
        average: 60
        period: 1s
        burst: 120
        sourceCriterion:
          requestHost: true

  services:
    acb-service:
      loadBalancer:
        passHostHeader: true
        responseForwarding:
          flushInterval: "100ms"
        servers:
          - url: "http://acb-web-blue:8090"
        healthCheck:
          path: "/readyz"
          interval: "5s"
          timeout: "2s"
