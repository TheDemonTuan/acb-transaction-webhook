http:
  routers:
    # Explicit higher-priority deny router blocking /internal endpoints from public ingress
    acb-deny-internal:
      rule: "Host(`bank.tuannguyenviet.site`) && PathPrefix(`/internal`)"
      entryPoints:
        - web
      priority: 1000
      middlewares:
        - deny-internal
      service: acb-service

    # Production router with explicit PathPrefix exclusion
    acb-router:
      rule: "Host(`bank.tuannguyenviet.site`) && !PathPrefix(`/internal`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - tunnel-only
        - security-headers
      service: acb-service

  services:
    acb-service:
      loadBalancer:
        passHostHeader: true
        responseForwarding:
          flushInterval: "100ms"
        servers:
          - url: "http://acb-web-blue:8090"
        healthCheck:
          path: "/readyz"
          interval: "5s"
          timeout: "2s"
