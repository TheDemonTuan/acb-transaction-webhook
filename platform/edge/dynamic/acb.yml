http:
  routers:
    # Explicit higher-priority deny router blocking /internal endpoints from public ingress
    acb-deny-internal:
      rule: "Host(`bank.tuannguyenviet.site`) && PathPrefix(`/internal`)"
      entryPoints:
        - web
      priority: 1000
      middlewares:
        - deny-internal
      service: acb-service

    acb-api-router:
      rule: "Host(`bank.tuannguyenviet.site`) && (PathPrefix(`/api`) || Path(`/health`) || Path(`/healthz`) || Path(`/ready`) || Path(`/readyz`))"
      entryPoints:
        - web
      priority: 200
      middlewares:
        - tunnel-only
        - security-headers
      service: acb-service

    acb-frontend-router:
      rule: "Host(`bank.tuannguyenviet.site`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - tunnel-only
        - security-headers
      service: acb-frontend-service

  services:
    acb-frontend-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://acb-frontend:8080"
        healthCheck:
          path: "/readyz"
          interval: "5s"
          timeout: "2s"

    acb-service:
      loadBalancer:
        passHostHeader: true
        responseForwarding:
          flushInterval: "100ms"
        servers:
          - url: "http://acb-web-blue:8090"
        healthCheck:
          path: "/readyz"
          interval: "5s"
          timeout: "2s"
