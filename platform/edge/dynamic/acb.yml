http:
  routers:
    # Explicit higher-priority deny router blocking /internal endpoints from public ingress
    acb-deny-internal:
      rule: "(Host(`bank.tuannguyenviet.site`) || Host(`transactions.tuannguyenviet.site`)) && PathPrefix(`/internal`)"
      entryPoints:
        - web
      priority: 1000
      middlewares:
        - deny-internal
      service: acb-service

    # Deny private and admin routes from public hostname
    acb-public-deny-private:
      rule: "Host(`transactions.tuannguyenviet.site`) && (PathPrefix(`/api/v1`) || PathPrefix(`/admin`))"
      entryPoints:
        - web
      priority: 900
      middlewares:
        - deny-internal
      service: acb-service

    # Public API router on transactions hostname
    acb-public-api-router:
      rule: "Host(`transactions.tuannguyenviet.site`) && (PathPrefix(`/api/public/v1`) || Path(`/health`) || Path(`/healthz`) || Path(`/ready`) || Path(`/readyz`))"
      entryPoints:
        - web
      priority: 300
      middlewares:
        - tunnel-only
        - security-headers
      service: acb-service

    # Authenticated API router on bank hostname
    acb-api-router:
      rule: "Host(`bank.tuannguyenviet.site`) && (PathPrefix(`/api`) || Path(`/health`) || Path(`/healthz`) || Path(`/ready`) || Path(`/readyz`))"
      entryPoints:
        - web
      priority: 200
      middlewares:
        - tunnel-only
        - security-headers
      service: acb-service

    # Public frontend router on transactions hostname
    acb-public-frontend-router:
      rule: "Host(`transactions.tuannguyenviet.site`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - tunnel-only
        - security-headers
      service: acb-frontend-service

    # Admin frontend router on bank hostname
    acb-frontend-router:
      rule: "Host(`bank.tuannguyenviet.site`)"
      entryPoints:
        - web
      priority: 100
      middlewares:
        - tunnel-only
        - security-headers
      service: acb-frontend-service

  services:
    acb-frontend-service:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://acb-frontend:8080"
        healthCheck:
          path: "/readyz"
          interval: "5s"
          timeout: "2s"

    acb-service:
      loadBalancer:
        passHostHeader: true
        responseForwarding:
          flushInterval: "100ms"
        servers:
          - url: "http://acb-web-blue:8090"
        healthCheck:
          path: "/readyz"
          interval: "5s"
          timeout: "2s"
