name: acb-transaction-webhook

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: acb-frontend-dev
    ports:
      - "5173:8080"
    depends_on: []

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: acb-gateway-dev
    ports:
      - "8090:8090"
    environment:
      APP_ENV: development
      RUNTIME_ROLE: monolith-dev
      LISTEN_ADDR: 0.0.0.0:8090
      DATA_DIR: /data
      DATABASE_PATH: /data/gateway.db
      TTS_GATEWAY_URL: http://tts-gateway:8081
      BARK_SERVER_URL: http://bark:8080
    volumes:
      - ./data:/data
    depends_on:
      - tts-gateway
      - bark

  bark:
    image: ghcr.io/finb/bark-server:latest
    container_name: acb-bark-dev
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Ho_Chi_Minh
      BARK_SERVER_ADDRESS: 0.0.0.0:8080
      BARK_SERVER_DATA_DIR: /data
    volumes:
      - ./data/bark:/data

  tts-gateway:
    build:
      context: ./tts-gateway
      dockerfile: Dockerfile
    container_name: acb-tts-gateway-dev
    ports:
      - "8081:8081"
    environment:
      TTS_HOST: 0.0.0.0
      TTS_PORT: 8081
      TZ: Asia/Ho_Chi_Minh
