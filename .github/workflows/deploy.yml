name: Build and deploy gateway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the immutable image to the configured VPS (manual approval required)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: acb-transaction-webhook-production
  cancel-in-progress: false

jobs:
  production-state:
    name: Read authoritative production state
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    outputs:
      state_artifact: production-state
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Read deployed commit and immutable image refs
        id: state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/acb-transaction-webhook' }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid DEPLOY_PATH" >&2; exit 1; }
          state="$(ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          rollout_journal="$DEPLOY_PATH/data/rollout-journal.json"
          pending_gw="$DEPLOY_PATH/data/pending-gateway-retire.env"
          pending_fe="$DEPLOY_PATH/data/pending-frontend-retire.env"
          runtime_dirty="false"
          rollout_status="NONE"
          pending_gateway_retire="false"
          pending_frontend_retire="false"
          if [[ -f "$rollout_journal" ]]; then
            rollout_status="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("status", "UNKNOWN"))' "$rollout_journal" 2>/dev/null || echo "UNKNOWN")"
            if [[ "$rollout_status" == "INTERRUPTED" ]]; then
              runtime_dirty="true"
            fi
          fi
          if [[ -f "$pending_gw" ]]; then
            runtime_dirty="true"
            pending_gateway_retire="true"
          fi
          if [[ -f "$pending_fe" ]]; then
            runtime_dirty="true"
            pending_frontend_retire="true"
          fi

          current_release="$DEPLOY_PATH/state/current-release.json"
          receipt="$DEPLOY_PATH/data/last-release.json"
          release_env="$DEPLOY_PATH/deploy/.release.env"
          [[ -s "$current_release" || ( -s "$receipt" && -s "$release_env" ) ]] || { echo 'Production state is missing' >&2; exit 1; }
          python3 - "$current_release" "$receipt" "$release_env" "$rollout_status" "$pending_gateway_retire" "$pending_frontend_retire" "$runtime_dirty" <<'PY'
          import json, os, re, sys
          current_path, receipt_path, env_path, r_status, p_gw, p_fe, r_dirty = sys.argv[1:8]
          digest = re.compile(r"^[^\s]+@sha256:[0-9a-f]{64}$")
          canonical_generation = 0
          if os.path.isfile(current_path):
              state = json.load(open(current_path, encoding="utf-8"))
              sha = state.get("git_sha", "")
              if state.get("schema_version") not in (1, 2) or state.get("status") != "COMPLETED" or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit("Canonical production release is invalid")
              active_slot = state.get("active_slots", {}).get("gateway")
              if active_slot not in ("blue", "green"):
                  raise SystemExit("Canonical gateway slot is invalid")
              images = state.get("images", {})
              values = {
                  "frontend_image": images.get("frontend", ""),
                  "gateway_image": images.get("gateway", {}).get(active_slot, "") if isinstance(images.get("gateway"), dict) else images.get("gateway", ""),
                  "worker_image": images.get("worker", ""),
                  "dbtool_image": images.get("dbtool", ""),
                  "auth_browser_image": images.get("auth_browser", ""),
                  "tts_image": images.get("tts", ""),
                  "bark_image": images.get("bark", ""),
              }
              canonical_generation = state.get('generation')
              if type(canonical_generation) is not int or canonical_generation < 0:
                  raise SystemExit('Canonical production generation is invalid')
              print(f"generation={canonical_generation}")
              print(f"canonical_generation={canonical_generation}")
          else:
              receipt = json.load(open(receipt_path, encoding="utf-8"))
              sha = receipt.get("git_sha", "")
              if receipt.get("status") != "SUCCESS" or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit("Legacy production receipt is invalid")
              env = {}
              for raw in open(env_path, encoding="utf-8"):
                  raw = raw.strip()
                  if raw and not raw.startswith("#") and "=" in raw:
                      key, value = raw.split("=", 1)
                      env[key.strip()] = value.strip()
              active_slot_path = f"{receipt_path.rsplit('/data/', 1)[0]}/deploy/.active-slot"
              active_slot = open(active_slot_path, encoding="utf-8").read().strip()
              if active_slot not in ("blue", "green"):
                  raise SystemExit("Legacy production gateway slot is invalid")
              values = {
                  "frontend_image": env.get("FRONTEND_IMAGE_REF", ""),
                  "gateway_image": env.get(f"IMAGE_REF_{active_slot.upper()}", ""),
                  "worker_image": env.get("WORKER_IMAGE_REF", ""),
                  "dbtool_image": env.get("DBTOOL_IMAGE_REF", ""),
                  "auth_browser_image": env.get("BROWSER_IMAGE_REF", ""),
                  "tts_image": env.get("TTS_IMAGE_REF", ""),
                  "bark_image": env.get("BARK_IMAGE_REF", ""),
              }
              print("generation=0")
              print("canonical_generation=0")
          print(f"sha={sha}")
          print(f"rollout_status={r_status}")
          print(f"pending_gateway_retire={p_gw}")
          print(f"pending_frontend_retire={p_fe}")
          print(f"runtime_dirty={r_dirty}")
          for output, value in values.items():
              if not digest.fullmatch(value):
                  raise SystemExit(f"Missing or invalid production image ref: {output}")
              print(f"{output}={value}")
          PY
          REMOTE
          )"
          printf '%s\n' "$state"
          sha="$(printf '%s\n' "$state" | sed -n 's/^sha=//p')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Production state did not return a valid SHA" >&2; exit 1; }
          printf '%s\n' "$state" > production-state.env
      - name: Upload production state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-state
          path: production-state.env
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify test and build
    needs: production-state
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      gateway: ${{ steps.scope.outputs.gateway }}
      worker: ${{ steps.scope.outputs.worker }}
      schema: ${{ steps.scope.outputs.schema }}
      auth_browser: ${{ steps.scope.outputs.auth_browser }}
      tts: ${{ steps.scope.outputs.tts }}
      bark: ${{ steps.scope.outputs.bark }}
      failover_controller: ${{ steps.scope.outputs.failover_controller }}
      platform: ${{ steps.scope.outputs.platform }}
      base_sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download production state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-state
          path: .production-state
      - name: Resolve verified production baseline
        id: baseline
        run: |
          set -euo pipefail
          PRODUCTION_BASE_SHA="$(sed -n 's/^sha=//p' .production-state/production-state.env)"
          if [[ -z "${PRODUCTION_BASE_SHA:-}" ]]; then
            echo "PRODUCTION_BASE_SHA must identify the last successfully promoted production commit." >&2
            exit 1
          fi
          if [[ ! "$PRODUCTION_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${PRODUCTION_BASE_SHA}^{commit}" 2>/dev/null; then
            echo "PRODUCTION_BASE_SHA is invalid or unavailable in repository history: $PRODUCTION_BASE_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PRODUCTION_BASE_SHA" "$GITHUB_SHA"; then
            echo "Production baseline is not an ancestor of the candidate; reconcile or roll back production state first." >&2
            exit 1
          fi
          echo "sha=$PRODUCTION_BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Compute component scope before builds
        id: scope
        env:
          LAST_RELEASE_COMMIT: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          scripts/compute-promotion-scope.sh --base "$LAST_RELEASE_COMMIT" --head "$GITHUB_SHA" --format env > scope.env
          cat scope.env
          while IFS='=' read -r key value; do
            case "$key" in
              PROMOTION_FRONTEND) echo "frontend=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_GATEWAY) echo "gateway=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_WORKER) echo "worker=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_SCHEMA) echo "schema=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_AUTH_BROWSER) echo "auth_browser=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_TTS) echo "tts=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_BARK) echo "bark=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_FAILOVER_CONTROLLER) echo "failover_controller=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_PLATFORM) echo "platform=$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < scope.env
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build and test frontend with Bun
        working-directory: web
        run: |
          bunx --bun tsc --noEmit
          bunx --bun vite build
          bunx --bun vitest run
      - name: Test Go gateway
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Test TTS Gateway
        working-directory: tts-gateway
        run: |
          pip install -r requirements.lock -r requirements-dev.lock
          pytest -v
      - name: Test failover controller
        run: |
          python3 -m pip install pytest
          python3 -m py_compile platform/failover/vps-failover-controller.py
          python3 -m pytest -q platform/failover/test_failover.py
      - name: Verify GitHub Actions are pinned to full commit SHAs
        run: bash scripts/verify-actions-pinned.sh
      - name: Test component promotion scope classifier
        run: bash scripts/test-promotion-scope.sh
      - name: Test promotion dispatcher and rollout orchestration
        run: bash deploy/tests/test_promotion_dispatcher.sh
      - name: Test deployment permissions and runtime policy
        run: |
          bash deploy/tests/test_secrets.sh
          bash deploy/tests/test_aux_deploy.sh
          bash deploy/tests/test_traefik_switch.sh
          bash deploy/tests/test_deploy_platform.sh
          bash deploy/tests/test_runtime_policy.sh
          bash deploy/tests/test_runtime_layout.sh
          bash deploy/tests/test_bootstrap_recovery.sh
          bash deploy/tests/test_legacy_frontend_recovery.sh
          bash deploy/tests/test_release_state.sh
          bash deploy/tests/test_release_rollback.sh
          bash deploy/tests/test_slot_resolution.sh
          bash deploy/tests/test_failover_bundle.sh
          bash deploy/tests/test_drift_complete.sh
          bash deploy/tests/test_preflight_vps.sh
          bash deploy/tests/test_deploy_workflow_runtime_preflight.sh
          bash deploy/tests/test_release_baseline.sh
          bash deploy/tests/test_deploy_rerun_contract.sh
          if [[ -f deploy/tests/test_trusted_engine_bootstrap.sh ]]; then bash deploy/tests/test_trusted_engine_bootstrap.sh; fi
          bash deploy/tests/test_release_bundle_runtime_contract.sh
          bash deploy/tests/test_staged_release_compose.sh
          bash deploy/tests/test_component_map_coverage.sh
          bash deploy/tests/test_schema_compatibility.sh
          bash deploy/tests/test_release_simulator.sh
          bash deploy/tests/test_release_crash_recovery.sh
      - name: Verify CI workflow timeouts, keepalives, and action pinning
        run: bash deploy/tests/test_ci_workflow.sh
      - name: Verify deployment and platform script syntax
        run: |
          shopt -s nullglob
          scripts=(deploy/*.sh scripts/*.sh scripts/ops/*.sh deploy/tests/*.sh platform/edge/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
      - name: Lint deployment and platform scripts
        run: |
          shopt -s nullglob
          scripts=(deploy/*.sh scripts/*.sh scripts/ops/*.sh platform/edge/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          shellcheck --severity=error "${scripts[@]}"
      - name: Test supply-chain validators and release manifest
        run: bash deploy/test-supply-chain.sh
      - name: Check generated source and whitespace
        run: git diff --check

  preflight-scan:
    name: Preflight scan pinned production images
    timeout-minutes: 10
    needs: production-state
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      security_rebuild_frontend: ${{ steps.scan.outputs.security_rebuild_frontend }}
      security_rebuild_gateway: ${{ steps.scan.outputs.security_rebuild_gateway }}
      security_rebuild_worker: ${{ steps.scan.outputs.security_rebuild_worker }}
      security_rebuild_schema: ${{ steps.scan.outputs.security_rebuild_schema }}
      security_rebuild_auth_browser: ${{ steps.scan.outputs.security_rebuild_auth_browser }}
      security_rebuild_tts: ${{ steps.scan.outputs.security_rebuild_tts }}
      bark_status: ${{ steps.scan.outputs.bark_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download production state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-state
          path: .production-state
      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --location --retry 3 --output "$archive" "$base/$archive"
          curl --fail --location --retry 3 --output trivy-checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "  $archive$" trivy-checksums.txt | sha256sum --check -
          tar -xzf "$archive" trivy
          install -m 0755 trivy "$RUNNER_TEMP/trivy"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run production image preflight scanner
        id: scan
        run: bash deploy/preflight-scan-images.sh --state .production-state/production-state.env
      - name: Upload preflight scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-security-reports
          path: preflight-reports/

  build-frontend-image:
    name: Build frontend GHCR image
    timeout-minutes: 15
    needs: [production-state, verify, preflight-scan]
    if: needs.verify.outputs.frontend == 'true' || needs.preflight-scan.outputs.security_rebuild_frontend == 'true'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}-frontend" >> "$GITHUB_OUTPUT"
      - name: Resolve build cache policy
        id: cache_policy
        env:
          SECURITY_REBUILD: ${{ needs.preflight-scan.outputs.security_rebuild_frontend }}
        run: |
          set -euo pipefail
          if [[ "$SECURITY_REBUILD" == "true" ]]; then
            echo "no_cache=true" >> "$GITHUB_OUTPUT"
            echo "pull=true" >> "$GITHUB_OUTPUT"
            echo "cache_from=" >> "$GITHUB_OUTPUT"
            echo "cache_to=" >> "$GITHUB_OUTPUT"
          else
            echo "no_cache=false" >> "$GITHUB_OUTPUT"
            echo "pull=false" >> "$GITHUB_OUTPUT"
            echo "cache_from=type=gha,scope=frontend" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=gha,mode=max,scope=frontend" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          target: frontend
          push: true
          pull: ${{ steps.cache_policy.outputs.pull == 'true' }}
          no-cache: ${{ steps.cache_policy.outputs.no_cache == 'true' }}
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          cache-from: ${{ steps.cache_policy.outputs.cache_from }}
          cache-to: ${{ steps.cache_policy.outputs.cache_to }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-gateway-image:
    name: Build gateway GHCR image
    timeout-minutes: 15
    needs: [production-state, verify, preflight-scan]
    if: needs.verify.outputs.gateway == 'true' || needs.preflight-scan.outputs.security_rebuild_gateway == 'true'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
      - name: Resolve build cache policy
        id: cache_policy
        env:
          SECURITY_REBUILD: ${{ needs.preflight-scan.outputs.security_rebuild_gateway }}
        run: |
          set -euo pipefail
          if [[ "$SECURITY_REBUILD" == "true" ]]; then
            echo "no_cache=true" >> "$GITHUB_OUTPUT"
            echo "pull=true" >> "$GITHUB_OUTPUT"
            echo "cache_from=" >> "$GITHUB_OUTPUT"
            echo "cache_to=" >> "$GITHUB_OUTPUT"
          else
            echo "no_cache=false" >> "$GITHUB_OUTPUT"
            echo "pull=false" >> "$GITHUB_OUTPUT"
            echo "cache_from=type=gha,scope=gateway" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=gha,mode=max,scope=gateway" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          target: gateway
          push: true
          pull: ${{ steps.cache_policy.outputs.pull == 'true' }}
          no-cache: ${{ steps.cache_policy.outputs.no_cache == 'true' }}
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          cache-from: ${{ steps.cache_policy.outputs.cache_from }}
          cache-to: ${{ steps.cache_policy.outputs.cache_to }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-worker-image:
    name: Build worker GHCR image
    timeout-minutes: 15
    needs: [production-state, verify, preflight-scan]
    if: needs.verify.outputs.worker == 'true' || needs.preflight-scan.outputs.security_rebuild_worker == 'true'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}-worker" >> "$GITHUB_OUTPUT"
      - name: Resolve build cache policy
        id: cache_policy
        env:
          SECURITY_REBUILD: ${{ needs.preflight-scan.outputs.security_rebuild_worker }}
        run: |
          set -euo pipefail
          if [[ "$SECURITY_REBUILD" == "true" ]]; then
            echo "no_cache=true" >> "$GITHUB_OUTPUT"
            echo "pull=true" >> "$GITHUB_OUTPUT"
            echo "cache_from=" >> "$GITHUB_OUTPUT"
            echo "cache_to=" >> "$GITHUB_OUTPUT"
          else
            echo "no_cache=false" >> "$GITHUB_OUTPUT"
            echo "pull=false" >> "$GITHUB_OUTPUT"
