name: Build and deploy gateway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the immutable image to the configured VPS (manual approval required)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: acb-transaction-webhook-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build and test frontend with Bun
        working-directory: web
        run: |
          bunx --bun tsc --noEmit
          bunx --bun vite build
          bunx --bun vitest run
      - name: Test Go gateway
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test TTS Gateway
        working-directory: tts-gateway
        run: |
          pip install -r requirements.txt
          pytest -v
      - name: Verify failover controller
        run: |
          python3 -m py_compile platform/failover/vps-failover-controller.py
          python3 -c "import importlib.util, sys; spec = importlib.util.spec_from_file_location('controller', 'platform/failover/vps-failover-controller.py'); mod = importlib.util.module_from_spec(spec); sys.modules[spec.name] = mod; spec.loader.exec_module(mod)"
      - name: Verify deployment and platform script syntax
        run: |
          shopt -s nullglob
          scripts=(deploy/*.sh scripts/ops/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
      - name: Lint deployment and platform scripts
        run: |
          shopt -s nullglob
          scripts=(deploy/*.sh scripts/ops/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          shellcheck --severity=error "${scripts[@]}"
      - name: Test supply-chain validators and release manifest
        run: bash deploy/test-supply-chain.sh
      - name: Check generated source and whitespace
        run: git diff --check

  build-gateway-image:
    name: Build gateway GHCR image
    needs: verify
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: gateway
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-worker-image:
    name: Build worker GHCR image
    needs: verify
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}-worker" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-dbtool-image:
    name: Build dbtool GHCR image
    needs: verify
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}-dbtool" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dbtool
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-auth-browser-image:
    name: Build auth-browser GHCR image
    needs: verify
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}-auth-browser" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.auth-browser
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Smoke test published auth-browser image
        env:
          AUTH_BROWSER_IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: bash deploy/smoke-test-auth-browser.sh "$AUTH_BROWSER_IMAGE"

  build-tts-gateway-image:
    name: Build tts-gateway GHCR image
    needs: verify
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}-tts-gateway" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./tts-gateway
          file: tts-gateway/Dockerfile
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Smoke test published tts-gateway image
        env:
          TTS_GATEWAY_IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: bash deploy/smoke-test-tts-gateway.sh "$TTS_GATEWAY_IMAGE"

  scan-and-attest:
    name: Scan, attest, and sign release artifacts
    needs:
      - verify
      - build-gateway-image
      - build-worker-image
      - build-dbtool-image
      - build-auth-browser-image
      - build-tts-gateway-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Cosign
        uses: sigstore/cosign-installer@053f9b74638557590800a301da1ba82351507e2c # v3.8.1
      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: 0.59.1
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --location --retry 3 --output "$archive" "$base/$archive"
          curl --fail --location --retry 3 --output trivy-checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "  $archive$" trivy-checksums.txt | sha256sum --check -
          tar -xzf "$archive" trivy
          install -m 0755 trivy "$RUNNER_TEMP/trivy"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate CVE exception allowlist
        run: |
          bash deploy/validate-cve-allowlist.sh \
            --file deploy/cve-allowlist.json \
            --output-ignorefile .trivyignore
      - name: Validate Bark third-party policy
        env:
          BARK_IMAGE_REF: ${{ vars.BARK_IMAGE_REF || 'ghcr.io/finb/bark-server@sha256:32d65b07fa835c99b31a396b77727a04ed058377fc2482da3e9dc7397167ffc4' }}
        run: |
          bash deploy/verify-third-party-policy.sh \
            --image "$BARK_IMAGE_REF" \
            --allowlist deploy/third-party-allowlist.json
      - name: Scan images and generate CycloneDX SBOMs with Trivy
        env:
          GATEWAY_IMAGE: ${{ needs.build-gateway-image.outputs.image }}@${{ needs.build-gateway-image.outputs.digest }}
          WORKER_IMAGE: ${{ needs.build-worker-image.outputs.image }}@${{ needs.build-worker-image.outputs.digest }}
          DBTOOL_IMAGE: ${{ needs.build-dbtool-image.outputs.image }}@${{ needs.build-dbtool-image.outputs.digest }}
          BROWSER_IMAGE: ${{ needs.build-auth-browser-image.outputs.image }}@${{ needs.build-auth-browser-image.outputs.digest }}
          TTS_IMAGE: ${{ needs.build-tts-gateway-image.outputs.image }}@${{ needs.build-tts-gateway-image.outputs.digest }}
          BARK_IMAGE_REF: ${{ vars.BARK_IMAGE_REF || 'ghcr.io/finb/bark-server@sha256:32d65b07fa835c99b31a396b77727a04ed058377fc2482da3e9dc7397167ffc4' }}
        run: |
          set -euo pipefail
          mkdir -p sbom-artifacts
          declare -A scan_images=(
            ["gateway"]="$GATEWAY_IMAGE"
            ["worker"]="$WORKER_IMAGE"
            ["dbtool"]="$DBTOOL_IMAGE"
            ["auth-browser"]="$BROWSER_IMAGE"
            ["tts-gateway"]="$TTS_IMAGE"
            ["bark"]="$BARK_IMAGE_REF"
          )
          for name in "${!scan_images[@]}"; do
            img="${scan_images[$name]}"
            printf "=== Scanning %s (%s) ===\n" "$name" "$img"
            trivy image --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore "$img"
            printf "=== Generating CycloneDX SBOM for %s ===\n" "$name"
            trivy image --format cyclonedx --output "sbom-artifacts/sbom-${name}.cdx.json" "$img"
          done
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: sbom-artifacts
          path: sbom-artifacts/
      - name: Sign first-party images with Cosign keyless OIDC
        env:
          GATEWAY_IMAGE: ${{ needs.build-gateway-image.outputs.image }}@${{ needs.build-gateway-image.outputs.digest }}
          WORKER_IMAGE: ${{ needs.build-worker-image.outputs.image }}@${{ needs.build-worker-image.outputs.digest }}
          DBTOOL_IMAGE: ${{ needs.build-dbtool-image.outputs.image }}@${{ needs.build-dbtool-image.outputs.digest }}
          BROWSER_IMAGE: ${{ needs.build-auth-browser-image.outputs.image }}@${{ needs.build-auth-browser-image.outputs.digest }}
          TTS_IMAGE: ${{ needs.build-tts-gateway-image.outputs.image }}@${{ needs.build-tts-gateway-image.outputs.digest }}
        run: |
          set -euo pipefail
          first_party=(
            "$GATEWAY_IMAGE"
            "$WORKER_IMAGE"
            "$DBTOOL_IMAGE"
            "$BROWSER_IMAGE"
            "$TTS_IMAGE"
          )
          for img in "${first_party[@]}"; do
            printf "=== Signing %s with Cosign ===\n" "$img"
            cosign sign --yes "$img"
          done
      - name: Verify first-party image signatures
        env:
          GATEWAY_IMAGE: ${{ needs.build-gateway-image.outputs.image }}@${{ needs.build-gateway-image.outputs.digest }}
          WORKER_IMAGE: ${{ needs.build-worker-image.outputs.image }}@${{ needs.build-worker-image.outputs.digest }}
          DBTOOL_IMAGE: ${{ needs.build-dbtool-image.outputs.image }}@${{ needs.build-dbtool-image.outputs.digest }}
          BROWSER_IMAGE: ${{ needs.build-auth-browser-image.outputs.image }}@${{ needs.build-auth-browser-image.outputs.digest }}
          TTS_IMAGE: ${{ needs.build-tts-gateway-image.outputs.image }}@${{ needs.build-tts-gateway-image.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cert_identity_regex="^https://github\.com/${REPO}/\.github/workflows/deploy\.yml@refs/heads/main$"
          oidc_issuer="https://token.actions.githubusercontent.com"
          first_party=(
            "$GATEWAY_IMAGE"
            "$WORKER_IMAGE"
            "$DBTOOL_IMAGE"
            "$BROWSER_IMAGE"
            "$TTS_IMAGE"
          )
          for img in "${first_party[@]}"; do
            printf "=== Verifying Cosign signature for %s ===\n" "$img"
            cosign verify \
              --certificate-identity-regexp "$cert_identity_regex" \
              --certificate-oidc-issuer "$oidc_issuer" \
              "$img"
          done
      - name: Generate release manifest JSON
        env:
          GATEWAY_IMAGE: ${{ needs.build-gateway-image.outputs.image }}@${{ needs.build-gateway-image.outputs.digest }}
          WORKER_IMAGE: ${{ needs.build-worker-image.outputs.image }}@${{ needs.build-worker-image.outputs.digest }}
          DBTOOL_IMAGE: ${{ needs.build-dbtool-image.outputs.image }}@${{ needs.build-dbtool-image.outputs.digest }}
          BROWSER_IMAGE: ${{ needs.build-auth-browser-image.outputs.image }}@${{ needs.build-auth-browser-image.outputs.digest }}
          TTS_IMAGE: ${{ needs.build-tts-gateway-image.outputs.image }}@${{ needs.build-tts-gateway-image.outputs.digest }}
          BARK_IMAGE_REF: ${{ vars.BARK_IMAGE_REF || 'ghcr.io/finb/bark-server@sha256:32d65b07fa835c99b31a396b77727a04ed058377fc2482da3e9dc7397167ffc4' }}
        run: |
          bash deploy/generate-release-manifest.sh \
            --git-sha "${{ github.sha }}" \
            --gateway-image "$GATEWAY_IMAGE" \
            --worker-image "$WORKER_IMAGE" \
            --dbtool-image "$DBTOOL_IMAGE" \
            --auth-browser-image "$BROWSER_IMAGE" \
            --tts-image "$TTS_IMAGE" \
            --bark-image "$BARK_IMAGE_REF" \
            --deploy-dir deploy \
            --output deploy/release-manifest.json
      - name: Sign release manifest blob with Cosign
        run: |
          cosign sign-blob --yes \
            --bundle deploy/release-manifest.bundle \
            deploy/release-manifest.json
      - name: Verify release manifest signature blob
        env:
          REPO: ${{ github.repository }}
        run: |
          cert_identity_regex="^https://github\.com/${REPO}/\.github/workflows/deploy\.yml@refs/heads/main$"
          oidc_issuer="https://token.actions.githubusercontent.com"
          cosign verify-blob \
            --bundle deploy/release-manifest.bundle \
            --certificate-identity-regexp "$cert_identity_regex" \
            --certificate-oidc-issuer "$oidc_issuer" \
            deploy/release-manifest.json
      - name: Upload release manifest artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-manifest
          path: |
            deploy/release-manifest.json
            deploy/release-manifest.bundle

  deploy:
    name: Deploy to VPS
    needs: [verify, build-gateway-image, build-worker-image, build-dbtool-image, build-auth-browser-image, build-tts-gateway-image, scan-and-attest]
    # Hard freeze: automatic deploy on push is disabled. Explicit workflow_dispatch approval required.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Download release manifest
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-manifest
          path: deploy/
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Sync deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/acb-transaction-webhook' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH/data' '$DEPLOY_PATH/secrets' '$DEPLOY_PATH/deploy'"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes \
            deploy/compose.prod.yaml "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/deploy/compose.prod.yaml.next"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes \
            deploy/deploy-warm.sh deploy/rollback-warm.sh deploy/switch-slot.sh \
            deploy/smoke-slot.sh deploy/check-host.sh \
            deploy/seccomp-auth-browser.json deploy/deploy.sh deploy/rollback.sh \
            deploy/verify-deployment.sh deploy/backup.sh deploy/bark-entrypoint.sh \
            deploy/smoke-test-bark.sh deploy/README.md \
            deploy/release-manifest.json deploy/release-manifest.bundle deploy/verify-manifest.sh \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/deploy/"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "chmod 755 '$DEPLOY_PATH/deploy/'*.sh"
      - name: Deploy immutable image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/acb-transaction-webhook' }}
          DASHBOARD_OWNER_EMAIL: ${{ vars.DASHBOARD_OWNER_EMAIL }}
          BARK_IMAGE_REF: ${{ vars.BARK_IMAGE_REF || 'ghcr.io/finb/bark-server@sha256:32d65b07fa835c99b31a396b77727a04ed058377fc2482da3e9dc7397167ffc4' }}
        run: |
          set -euo pipefail
          [[ -n "$DASHBOARD_OWNER_EMAIL" ]] || { printf 'DASHBOARD_OWNER_EMAIL is required.\n' >&2; exit 1; }
          [[ "$BARK_IMAGE_REF" =~ ^[^[:space:]]+@sha256:[a-f0-9]{64}$ ]] || { printf 'BARK_IMAGE_REF must be an immutable digest.\n' >&2; exit 1; }
          image="${{ needs.build-gateway-image.outputs.image }}@${{ needs.build-gateway-image.outputs.digest }}"
          worker_image="${{ needs.build-worker-image.outputs.image }}@${{ needs.build-worker-image.outputs.digest }}"
          dbtool_image="${{ needs.build-dbtool-image.outputs.image }}@${{ needs.build-dbtool-image.outputs.digest }}"
          browser_image="${{ needs.build-auth-browser-image.outputs.image }}@${{ needs.build-auth-browser-image.outputs.digest }}"
          tts_image="${{ needs.build-tts-gateway-image.outputs.image }}@${{ needs.build-tts-gateway-image.outputs.digest }}"
          owner="$(printf '%s' "$DASHBOARD_OWNER_EMAIL" | tr '[:upper:]' '[:lower:]')"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' OWNER='$owner' IMAGE='$image' WORKER_IMAGE='$worker_image' DBTOOL_IMAGE='$dbtool_image' BROWSER_IMAGE='$browser_image' TTS_IMAGE='$tts_image' BARK_IMAGE_REF='$BARK_IMAGE_REF' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          # Preflight: verify release manifest, artifact checksums, and image digests before any remote mutation
          bash "$DEPLOY_PATH/deploy/verify-manifest.sh" \
            --manifest "$DEPLOY_PATH/deploy/release-manifest.json" \
            --bundle "$DEPLOY_PATH/deploy/release-manifest.bundle" \
            --deploy-dir "$DEPLOY_PATH/deploy" \
            --gateway-image "$IMAGE" \
            --worker-image "$WORKER_IMAGE" \
            --dbtool-image "$DBTOOL_IMAGE" \
            --browser-image "$BROWSER_IMAGE" \
            --tts-image "$TTS_IMAGE" \
            --bark-image "$BARK_IMAGE_REF"

          env_file="$DEPLOY_PATH/.env.production"
          [[ -f "$env_file" ]] || { printf 'Missing production env file: %s\n' "$env_file" >&2; exit 1; }
          tmp="$(mktemp "${env_file}.XXXXXX")"
          staged_compose="$DEPLOY_PATH/deploy/compose.prod.yaml.next"
          [[ -f "$staged_compose" ]] || { printf 'Missing staged compose file: %s\n' "$staged_compose" >&2; exit 1; }
          trap 'rm -f "$tmp"' EXIT
          grep -v -E '^(OWNER_SUBJECTS|CLOUDFLARE_ACCESS_OWNER_EMAIL)=' "$env_file" > "$tmp" || true
          printf 'OWNER_SUBJECTS=%s\n' "$OWNER" >> "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" "$env_file"
          if [[ -d "$DEPLOY_PATH/secrets/tts_internal_token" ]]; then
            rmdir "$DEPLOY_PATH/secrets/tts_internal_token" 2>/dev/null || rm -rf "$DEPLOY_PATH/secrets/tts_internal_token" 2>/dev/null || docker run --rm --user 0:0 -v "$DEPLOY_PATH/secrets:/s" --entrypoint /bin/sh "$TTS_IMAGE" -c 'rm -rf /s/tts_internal_token' 2>/dev/null || true
          fi
          if [[ -d "$DEPLOY_PATH/secrets/app_master_key" ]]; then
            rmdir "$DEPLOY_PATH/secrets/app_master_key" 2>/dev/null || rm -rf "$DEPLOY_PATH/secrets/app_master_key" 2>/dev/null || docker run --rm --user 0:0 -v "$DEPLOY_PATH/secrets:/s" --entrypoint /bin/sh "$TTS_IMAGE" -c 'rm -rf /s/app_master_key' 2>/dev/null || true
          fi
          cd "$DEPLOY_PATH"
          export IMAGE_REF="$IMAGE"
          export WORKER_IMAGE_REF="$WORKER_IMAGE"
          export DBTOOL_IMAGE_REF="$DBTOOL_IMAGE"
          export BROWSER_IMAGE_REF="$BROWSER_IMAGE"
          export TTS_IMAGE_REF="$TTS_IMAGE"
          export BARK_IMAGE_REF="$BARK_IMAGE_REF"
          export UPGRADE_CORE=1
          cd "$DEPLOY_PATH"
          timeout 900 ./deploy/deploy-warm.sh --upgrade-core "$IMAGE"
          REMOTE
