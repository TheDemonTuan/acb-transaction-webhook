name: Build and deploy gateway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the immutable image to the configured VPS (manual approval required)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: acb-transaction-webhook-production
  cancel-in-progress: false

jobs:
  production-state:
    name: Read authoritative production state
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    outputs:
      state_artifact: production-state
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Read deployed commit and immutable image refs
        id: state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/acb-transaction-webhook' }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid DEPLOY_PATH" >&2; exit 1; }
          state="$(ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          receipt="$DEPLOY_PATH/data/last-release.json"
          release_env="$DEPLOY_PATH/deploy/.release.env"
          [[ -s "$receipt" && -s "$release_env" ]] || { echo 'Production state is missing' >&2; exit 1; }
          python3 - "$receipt" "$release_env" <<'PY'
          import json, re, sys
          receipt_path, env_path = sys.argv[1:]
          receipt = json.load(open(receipt_path, encoding="utf-8"))
          sha = receipt.get("git_sha", "")
          if receipt.get("status") != "SUCCESS" or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Production receipt is not a valid successful release")
          values = {}
          for raw in open(env_path, encoding="utf-8"):
              raw = raw.strip()
              if raw and not raw.startswith("#") and "=" in raw:
                  key, value = raw.split("=", 1)
                  values[key.strip()] = value.strip()
          keys = {
              "frontend_image": "FRONTEND_IMAGE_REF",
              "worker_image": "WORKER_IMAGE_REF",
              "dbtool_image": "DBTOOL_IMAGE_REF",
              "auth_browser_image": "BROWSER_IMAGE_REF",
              "tts_image": "TTS_IMAGE_REF",
              "bark_image": "BARK_IMAGE_REF",
          }
          active_slot_path = f"{receipt_path.rsplit('/data/', 1)[0]}/deploy/.active-slot"
          try:
              active_slot = open(active_slot_path, encoding="utf-8").read().strip()
          except FileNotFoundError:
              raise SystemExit("Production active gateway slot is missing")
          if active_slot not in ("blue", "green"):
              raise SystemExit("Production active gateway slot is invalid")
          keys["gateway_image"] = f"IMAGE_REF_{active_slot.upper()}"
          digest = re.compile(r"^[^\s]+@sha256:[0-9a-f]{64}$")
          print(f"sha={sha}")
          for output, key in keys.items():
              value = values.get(key, "")
              if not digest.fullmatch(value):
                  raise SystemExit(f"Missing or invalid production image ref: {key}")
              print(f"{output}={value}")
          PY
          REMOTE
          )"
          printf '%s\n' "$state"
          sha="$(printf '%s\n' "$state" | sed -n 's/^sha=//p')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Production state did not return a valid SHA" >&2; exit 1; }
          printf '%s\n' "$state" > production-state.env
      - name: Upload production state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-state
          path: production-state.env
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify test and build
    needs: production-state
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      gateway: ${{ steps.scope.outputs.gateway }}
      worker: ${{ steps.scope.outputs.worker }}
      schema: ${{ steps.scope.outputs.schema }}
      auth_browser: ${{ steps.scope.outputs.auth_browser }}
      tts: ${{ steps.scope.outputs.tts }}
      bark: ${{ steps.scope.outputs.bark }}
      platform: ${{ steps.scope.outputs.platform }}
      base_sha: ${{ steps.baseline.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download production state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-state
          path: .production-state
      - name: Resolve verified production baseline
        id: baseline
        run: |
          set -euo pipefail
          PRODUCTION_BASE_SHA="$(sed -n 's/^sha=//p' .production-state/production-state.env)"
          if [[ -z "${PRODUCTION_BASE_SHA:-}" ]]; then
            echo "PRODUCTION_BASE_SHA must identify the last successfully promoted production commit." >&2
            exit 1
          fi
          if [[ ! "$PRODUCTION_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${PRODUCTION_BASE_SHA}^{commit}" 2>/dev/null; then
            echo "PRODUCTION_BASE_SHA is invalid or unavailable in repository history: $PRODUCTION_BASE_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PRODUCTION_BASE_SHA" "$GITHUB_SHA"; then
            echo "Production baseline is not an ancestor of the candidate; reconcile or roll back production state first." >&2
            exit 1
          fi
          echo "sha=$PRODUCTION_BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Compute component scope before builds
        id: scope
        env:
          LAST_RELEASE_COMMIT: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          scripts/compute-promotion-scope.sh --base "$LAST_RELEASE_COMMIT" --head "$GITHUB_SHA" --format env > scope.env
          cat scope.env
          while IFS='=' read -r key value; do
            case "$key" in
              PROMOTION_FRONTEND) echo "frontend=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_GATEWAY) echo "gateway=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_WORKER) echo "worker=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_SCHEMA) echo "schema=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_AUTH_BROWSER) echo "auth_browser=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_TTS) echo "tts=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_BARK) echo "bark=$value" >> "$GITHUB_OUTPUT" ;;
              PROMOTION_PLATFORM) echo "platform=$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < scope.env
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.1
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build and test frontend with Bun
        working-directory: web
        run: |
          bunx --bun tsc --noEmit
          bunx --bun vite build
          bunx --bun vitest run
      - name: Test Go gateway
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test TTS Gateway
        working-directory: tts-gateway
        run: |
          pip install -r requirements.txt
          pytest -v
      - name: Test failover controller
        run: |
          python3 -m pip install pytest
          python3 -m py_compile platform/failover/vps-failover-controller.py
          python3 -m pytest -q platform/failover/test_failover.py
      - name: Verify GitHub Actions are pinned to full commit SHAs
        run: bash scripts/verify-actions-pinned.sh
      - name: Test component promotion scope classifier
        run: bash scripts/test-promotion-scope.sh
      - name: Test promotion dispatcher and rollout orchestration
        run: bash deploy/tests/test_promotion_dispatcher.sh
      - name: Verify CI workflow timeouts, keepalives, and action pinning
        run: bash deploy/tests/test_ci_workflow.sh
      - name: Verify deployment and platform script syntax
        run: |
          shopt -s nullglob
          scripts=(deploy/*.sh scripts/*.sh scripts/ops/*.sh deploy/tests/*.sh platform/edge/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
      - name: Lint deployment and platform scripts
        run: |
          shopt -s nullglob
          scripts=(deploy/*.sh scripts/*.sh scripts/ops/*.sh platform/edge/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          shellcheck --severity=error "${scripts[@]}"
      - name: Test supply-chain validators and release manifest
        run: bash deploy/test-supply-chain.sh
      - name: Check generated source and whitespace
        run: git diff --check

  build-frontend-image:
    name: Build frontend GHCR image
    timeout-minutes: 15
    needs: [production-state, verify]
    if: needs.verify.outputs.frontend == 'true'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}-frontend" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          target: frontend
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-gateway-image:
    name: Build gateway GHCR image
    timeout-minutes: 15
    needs: [production-state, verify]
    if: needs.verify.outputs.gateway == 'true'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          target: gateway
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-worker-image:
    name: Build worker GHCR image
    timeout-minutes: 15
    needs: [production-state, verify]
    if: needs.verify.outputs.worker == 'true'
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
