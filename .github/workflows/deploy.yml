  scan-and-attest:
    name: Scan, attest, and sign release artifacts
    timeout-minutes: 20
    if: always() && needs.verify.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs:
      - production-state
      - verify
      - preflight-scan
      - build-frontend-image
      - build-gateway-image
      - build-worker-image
      - build-dbtool-image
      - build-auth-browser-image
      - build-tts-gateway-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download authoritative production state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-state
          path: .production-state
      - name: Load authoritative production image refs
        run: |
          set -euo pipefail
          state=.production-state/production-state.env
          [[ -s "$state" ]] || { echo "Production state artifact is missing" >&2; exit 1; }
          while IFS='=' read -r key value; do
            case "$key" in
              frontend_image|gateway_image|worker_image|dbtool_image|auth_browser_image|tts_image|bark_image)
                [[ "$value" =~ ^[^[:space:]]+@sha256:[a-f0-9]{64}$ ]] || { echo "Invalid production digest for $key" >&2; exit 1; }
                printf 'PRODUCTION_%s=%s\n' "$(printf '%s' "$key" | tr '[:lower:]' '[:upper:]')" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < "$state"
      - name: Install Cosign
        id: cosign_installer
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: 'v2.4.3'
        continue-on-error: true
      - name: Resilient fallback install Cosign with checksum verification
        if: steps.cosign_installer.outcome != 'success'
        run: |
          set -euo pipefail
          echo "sigstore/cosign-installer failed; executing verified fallback download..."
          COSIGN_VERSION="v2.4.3"
          archive="cosign-linux-amd64"
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}"
          curl --fail --location --retry 5 --retry-delay 2 --retry-connrefused --output "$RUNNER_TEMP/$archive" "$base/$archive"
          curl --fail --location --retry 5 --retry-delay 2 --retry-connrefused --output "$RUNNER_TEMP/cosign_checksums.txt" "$base/cosign_checksums.txt"
          grep "  $archive$" "$RUNNER_TEMP/cosign_checksums.txt" | (cd "$RUNNER_TEMP" && sha256sum --check -)
          install -m 0755 "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/cosign"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cosign" version
      - name: Verify Cosign is installed
        run: |
          cosign version
      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --location --retry 3 --output "$archive" "$base/$archive"
          curl --fail --location --retry 3 --output trivy-checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "  $archive$" trivy-checksums.txt | sha256sum --check -
          tar -xzf "$archive" trivy
          install -m 0755 trivy "$RUNNER_TEMP/trivy"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate CVE exception allowlist
        run: |
          bash deploy/validate-cve-allowlist.sh \
            --file deploy/cve-allowlist.json \
            --output-ignorefile .trivyignore
          for comp in frontend gateway worker dbtool auth-browser tts-gateway; do
            bash deploy/validate-cve-allowlist.sh \
              --file deploy/cve-allowlist.json \
              --component "$comp" \
              --output-ignorefile ".trivyignore-${comp}"
          done
      - name: Validate Bark third-party policy
        env:
          BARK_IMAGE_REF: ${{ env.PRODUCTION_BARK_IMAGE }}
        run: |
          bash deploy/verify-third-party-policy.sh \
            --image "$BARK_IMAGE_REF" \
            --allowlist deploy/third-party-allowlist.json
      - name: Scan core first-party images with Trivy (frontend, gateway, worker, dbtool)
        env:
          FRONTEND_IMAGE: ${{ needs.build-frontend-image.outputs.digest && format('{0}@{1}', needs.build-frontend-image.outputs.image, needs.build-frontend-image.outputs.digest) || env.PRODUCTION_FRONTEND_IMAGE }}
          GATEWAY_IMAGE: ${{ needs.build-gateway-image.outputs.digest && format('{0}@{1}', needs.build-gateway-image.outputs.image, needs.build-gateway-image.outputs.digest) || env.PRODUCTION_GATEWAY_IMAGE }}
          WORKER_IMAGE: ${{ needs.build-worker-image.outputs.digest && format('{0}@{1}', needs.build-worker-image.outputs.image, needs.build-worker-image.outputs.digest) || env.PRODUCTION_WORKER_IMAGE }}
          DBTOOL_IMAGE: ${{ needs.build-dbtool-image.outputs.digest && format('{0}@{1}', needs.build-dbtool-image.outputs.image, needs.build-dbtool-image.outputs.digest) || env.PRODUCTION_DBTOOL_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p sbom-artifacts security-reports

          names=(frontend gateway worker dbtool)
          images=("$FRONTEND_IMAGE" "$GATEWAY_IMAGE" "$WORKER_IMAGE" "$DBTOOL_IMAGE")

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "### Core Images Security Gate Summary"
              echo ""
              echo "| Component | Image Digest | CVE | Installed | Fixed In | Status |"
              echo "|---|---|---|---|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          failed=0
          for i in "${!names[@]}"; do
            name="${names[$i]}"
            img="${images[$i]}"
            [[ "$img" =~ ^[^[:space:]]+@sha256:[a-f0-9]{64}$ ]] || { echo "Missing immutable current/candidate digest for $name" >&2; exit 1; }
            echo "=== Scanning core image: $name ($img) ==="

            # Always generate machine-readable JSON report and CycloneDX SBOM
            trivy image \
              --platform linux/arm64 \
              --scanners vuln \
              --format json \
              --output "security-reports/trivy-${name}.json" \
              "$img"

            trivy image \
              --platform linux/arm64 \
              --format cyclonedx \
              --output "sbom-artifacts/sbom-${name}.cdx.json" \
              "$img"

            node - "security-reports/trivy-${name}.json" ".trivyignore-${name}" "$name" "$img" <<'JSEOF' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            const fs = require('fs');
            const [,, reportPath, ignorePath, name, img] = process.argv;
            try {
              let ignored = new Set();
              if (fs.existsSync(ignorePath)) {
                for (const l of fs.readFileSync(ignorePath, 'utf8').split('\n')) {
                  const t = l.trim();
                  if (t && !t.startsWith('#')) ignored.add(t);
                }
              }
              const data = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const vulns = [];
              if (data.Results) {
                for (const r of data.Results) {
                  if (r.Vulnerabilities) {
                    for (const v of r.Vulnerabilities) {
                      if ((v.Severity === 'HIGH' || v.Severity === 'CRITICAL') && !ignored.has(v.VulnerabilityID)) {
                        vulns.push(v);
                      }
                    }
                  }
                }
              }
              const digest = (img.split('@')[1] || img).substring(0, 19) + '...';
              if (vulns.length === 0) {
                console.log(`| ${name} | \`${digest}\` | - | - | - | ✅ CLEAN (0 HIGH/CRITICAL) |`);
              } else {
                for (const v of vulns) {
                  console.log(`| ${name} | \`${digest}\` | ${v.VulnerabilityID} | ${v.PkgName} ${v.InstalledVersion || ''} | ${v.FixedVersion || 'none'} | ❌ ${v.Severity} BLOCKED |`);
                }
              }
            } catch (e) {}
            JSEOF

            # Core first-party policy: zero-tolerance on HIGH/CRITICAL unless in allowlist
            if ! trivy image \
              --platform linux/arm64 \
              --scanners vuln \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignorefile ".trivyignore-${name}" \
              "$img"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Scan sidecar first-party images with Trivy (auth-browser, tts-gateway)
        env:
          BROWSER_IMAGE: ${{ needs.build-auth-browser-image.outputs.digest && format('{0}@{1}', needs.build-auth-browser-image.outputs.image, needs.build-auth-browser-image.outputs.digest) || env.PRODUCTION_AUTH_BROWSER_IMAGE }}
          TTS_IMAGE: ${{ needs.build-tts-gateway-image.outputs.digest && format('{0}@{1}', needs.build-tts-gateway-image.outputs.image, needs.build-tts-gateway-image.outputs.digest) || env.PRODUCTION_TTS_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p sbom-artifacts security-reports

          names=(auth-browser tts-gateway)
          images=("$BROWSER_IMAGE" "$TTS_IMAGE")

          failed=0
          for i in "${!names[@]}"; do
            name="${names[$i]}"
            img="${images[$i]}"
            echo "=== Scanning sidecar image: $name ($img) ==="

            # Generate CycloneDX SBOM and full vulnerability report for sidecars
            trivy image \
              --platform linux/arm64 \
              --scanners vuln \
              --format json \
              --output "security-reports/trivy-${name}.json" \
              "$img"

            trivy image \
              --platform linux/arm64 \
              --format cyclonedx \
              --output "sbom-artifacts/sbom-${name}.cdx.json" \
              "$img"

            node - "security-reports/trivy-${name}.json" ".trivyignore-${name}" "$name" "$img" <<'JSEOF' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            const fs = require('fs');
            const [,, reportPath, ignorePath, name, img] = process.argv;
            try {
              let ignored = new Set();
              if (fs.existsSync(ignorePath)) {
                for (const l of fs.readFileSync(ignorePath, 'utf8').split('\n')) {
                  const t = l.trim();
                  if (t && !t.startsWith('#')) ignored.add(t);
                }
              }
              const data = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const vulns = [];
              if (data.Results) {
                for (const r of data.Results) {
                  if (r.Vulnerabilities) {
                    for (const v of r.Vulnerabilities) {
                      if ((v.Severity === 'HIGH' || v.Severity === 'CRITICAL') && !ignored.has(v.VulnerabilityID)) {
                        vulns.push(v);
                      }
                    }
                  }
                }
              }
              const digest = (img.split('@')[1] || img).substring(0, 19) + '...';
              if (vulns.length === 0) {
                console.log(`| ${name} | \`${digest}\` | - | - | - | ✅ CLEAN (0 HIGH/CRITICAL) |`);
              } else {
                for (const v of vulns) {
                  console.log(`| ${name} | \`${digest}\` | ${v.VulnerabilityID} | ${v.PkgName} ${v.InstalledVersion || ''} | ${v.FixedVersion || 'none'} | ❌ ${v.Severity} BLOCKED |`);
                }
              }
            } catch (e) {}
            JSEOF

            # Sidecar policy: CRITICAL and HIGH release-blocking unless documented in allowlist
            if ! trivy image \
              --platform linux/arm64 \
              --scanners vuln \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignorefile ".trivyignore-${name}" \
              "$img"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Scan approved third-party Bark image
        env:
          BARK_IMAGE_REF: ${{ env.PRODUCTION_BARK_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p sbom-artifacts security-reports

          echo "=== Third-party scan: Bark ($BARK_IMAGE_REF) ==="

          # Preserve all HIGH/CRITICAL findings for auditing
          trivy image \
            --platform linux/arm64 \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output security-reports/trivy-bark.json \
            "$BARK_IMAGE_REF"

          trivy image \
            --platform linux/arm64 \
            --format cyclonedx \
            --output sbom-artifacts/sbom-bark.cdx.json \
            "$BARK_IMAGE_REF"

          # Third-party pinned dependency policy:
          # CRITICAL is a hard release blocker; HIGH is recorded and tracked
          trivy image \
            --platform linux/arm64 \
            --scanners vuln \
            --exit-code 1 \
            --severity CRITICAL \
            "$BARK_IMAGE_REF"

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-artifacts
          path: |
            sbom-artifacts/
            security-reports/

      - name: Sign first-party images with Cosign keyless OIDC
        env:
          FRONTEND_IMAGE: ${{ needs.build-frontend-image.outputs.digest && format('{0}@{1}', needs.build-frontend-image.outputs.image, needs.build-frontend-image.outputs.digest) || env.PRODUCTION_FRONTEND_IMAGE }}
          GATEWAY_IMAGE: ${{ needs.build-gateway-image.outputs.digest && format('{0}@{1}', needs.build-gateway-image.outputs.image, needs.build-gateway-image.outputs.digest) || env.PRODUCTION_GATEWAY_IMAGE }}
          WORKER_IMAGE: ${{ needs.build-worker-image.outputs.digest && format('{0}@{1}', needs.build-worker-image.outputs.image, needs.build-worker-image.outputs.digest) || env.PRODUCTION_WORKER_IMAGE }}
          DBTOOL_IMAGE: ${{ needs.build-dbtool-image.outputs.digest && format('{0}@{1}', needs.build-dbtool-image.outputs.image, needs.build-dbtool-image.outputs.digest) || env.PRODUCTION_DBTOOL_IMAGE }}
          BROWSER_IMAGE: ${{ needs.build-auth-browser-image.outputs.digest && format('{0}@{1}', needs.build-auth-browser-image.outputs.image, needs.build-auth-browser-image.outputs.digest) || env.PRODUCTION_AUTH_BROWSER_IMAGE }}
          TTS_IMAGE: ${{ needs.build-tts-gateway-image.outputs.digest && format('{0}@{1}', needs.build-tts-gateway-image.outputs.image, needs.build-tts-gateway-image.outputs.digest) || env.PRODUCTION_TTS_IMAGE }}
        run: |
          set -euo pipefail
          first_party=(
            "$FRONTEND_IMAGE"
            "$GATEWAY_IMAGE"
            "$WORKER_IMAGE"
            "$DBTOOL_IMAGE"
            "$BROWSER_IMAGE"
            "$TTS_IMAGE"
          )
          for img in "${first_party[@]}"; do
            [[ "$img" =~ ^[^[:space:]]+@sha256:[a-f0-9]{64}$ ]] || { echo "Missing immutable current/candidate image digest" >&2; exit 1; }
            printf "=== Signing %s with Cosign ===\n" "$img"
            cosign sign --yes "$img"
          done

      - name: Verify first-party image signatures
        env:
          FRONTEND_IMAGE: ${{ needs.build-frontend-image.outputs.digest && format('{0}@{1}', needs.build-frontend-image.outputs.image, needs.build-frontend-image.outputs.digest) || env.PRODUCTION_FRONTEND_IMAGE }}
          GATEWAY_IMAGE: ${{ needs.build-gateway-image.outputs.digest && format('{0}@{1}', needs.build-gateway-image.outputs.image, needs.build-gateway-image.outputs.digest) || env.PRODUCTION_GATEWAY_IMAGE }}
          WORKER_IMAGE: ${{ needs.build-worker-image.outputs.digest && format('{0}@{1}', needs.build-worker-image.outputs.image, needs.build-worker-image.outputs.digest) || env.PRODUCTION_WORKER_IMAGE }}
          DBTOOL_IMAGE: ${{ needs.build-dbtool-image.outputs.digest && format('{0}@{1}', needs.build-dbtool-image.outputs.image, needs.build-dbtool-image.outputs.digest) || env.PRODUCTION_DBTOOL_IMAGE }}
          BROWSER_IMAGE: ${{ needs.build-auth-browser-image.outputs.digest && format('{0}@{1}', needs.build-auth-browser-image.outputs.image, needs.build-auth-browser-image.outputs.digest) || env.PRODUCTION_AUTH_BROWSER_IMAGE }}
          TTS_IMAGE: ${{ needs.build-tts-gateway-image.outputs.digest && format('{0}@{1}', needs.build-tts-gateway-image.outputs.image, needs.build-tts-gateway-image.outputs.digest) || env.PRODUCTION_TTS_IMAGE }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_identity="https://github.com/${REPO}/.github/workflows/deploy.yml@refs/heads/main"
          oidc_issuer="https://token.actions.githubusercontent.com"
          first_party=(
            "$FRONTEND_IMAGE"
            "$GATEWAY_IMAGE"
            "$WORKER_IMAGE"
            "$DBTOOL_IMAGE"
            "$BROWSER_IMAGE"
            "$TTS_IMAGE"
          )
          for img in "${first_party[@]}"; do
            [[ "$img" =~ ^[^[:space:]]+@sha256:[a-f0-9]{64}$ ]] || { echo "Missing immutable current/candidate image digest" >&2; exit 1; }
            printf "=== Verifying Cosign signature for %s ===\n" "$img"
            cosign verify \
              --certificate-identity "$expected_identity" \
              --certificate-oidc-issuer "$oidc_issuer" \
              "$img"
          done

      - name: Compute promotion scope
        id: scope
        env:
          LAST_RELEASE_COMMIT: ${{ needs.verify.outputs.base_sha }}
        run: |
          bash scripts/compute-promotion-scope.sh \
            --base "$LAST_RELEASE_COMMIT" \
            --head "$GITHUB_SHA" \
            --format json \
            --output deploy/promotion-scope.json
          echo "Promotion scope computed:"
          cat deploy/promotion-scope.json

      - name: Stage platform assets into the signed release
        run: bash deploy/stage-platform-assets.sh
      - name: Read canonical generation used for signing
        id: baseline_generation
        run: |
          set -euo pipefail
          state=.production-state/production-state.env
          generation="$(sed -n 's/^canonical_generation=//p' "$state")"
          [[ "$generation" =~ ^(0|[1-9][0-9]*)$ ]] || { echo 'Canonical baseline generation missing' >&2; exit 1; }
          printf 'generation=%s\n' "$generation" >> "$GITHUB_OUTPUT"
      - name: Generate release manifest JSON
        env:
          FRONTEND_IMAGE: ${{ needs.build-frontend-image.outputs.digest && format('{0}@{1}', needs.build-frontend-image.outputs.image, needs.build-frontend-image.outputs.digest) || env.PRODUCTION_FRONTEND_IMAGE }}
          GATEWAY_IMAGE: ${{ needs.build-gateway-image.outputs.digest && format('{0}@{1}', needs.build-gateway-image.outputs.image, needs.build-gateway-image.outputs.digest) || env.PRODUCTION_GATEWAY_IMAGE }}
          WORKER_IMAGE: ${{ needs.build-worker-image.outputs.digest && format('{0}@{1}', needs.build-worker-image.outputs.image, needs.build-worker-image.outputs.digest) || env.PRODUCTION_WORKER_IMAGE }}
          DBTOOL_IMAGE: ${{ needs.build-dbtool-image.outputs.digest && format('{0}@{1}', needs.build-dbtool-image.outputs.image, needs.build-dbtool-image.outputs.digest) || env.PRODUCTION_DBTOOL_IMAGE }}
          BROWSER_IMAGE: ${{ needs.build-auth-browser-image.outputs.digest && format('{0}@{1}', needs.build-auth-browser-image.outputs.image, needs.build-auth-browser-image.outputs.digest) || env.PRODUCTION_AUTH_BROWSER_IMAGE }}
          TTS_IMAGE: ${{ needs.build-tts-gateway-image.outputs.digest && format('{0}@{1}', needs.build-tts-gateway-image.outputs.image, needs.build-tts-gateway-image.outputs.digest) || env.PRODUCTION_TTS_IMAGE }}
          BARK_IMAGE_REF: ${{ env.PRODUCTION_BARK_IMAGE }}
        run: |
          bash deploy/generate-release-manifest.sh \
            --git-sha "${{ github.sha }}" \
            --base-sha "${{ needs.verify.outputs.base_sha }}" \
            --base-generation "${{ steps.baseline_generation.outputs.generation }}" \
            --promotion-scope-file deploy/promotion-scope.json \
            --frontend-image "$FRONTEND_IMAGE" \
            --gateway-image "$GATEWAY_IMAGE" \
            --worker-image "$WORKER_IMAGE" \
            --dbtool-image "$DBTOOL_IMAGE" \
            --auth-browser-image "$BROWSER_IMAGE" \
            --tts-image "$TTS_IMAGE" \
            --bark-image "$BARK_IMAGE_REF" \
            --deploy-dir deploy \
            --output deploy/release-manifest.json

      - name: Sign release manifest blob with Cosign
        run: |
          cosign sign-blob --yes \
            --bundle deploy/release-manifest.bundle \
            deploy/release-manifest.json

      - name: Verify release manifest signature blob
        env:
          REPO: ${{ github.repository }}
        run: |
          expected_identity="https://github.com/${REPO}/.github/workflows/deploy.yml@refs/heads/main"
          oidc_issuer="https://token.actions.githubusercontent.com"
          cosign verify-blob \
            --bundle deploy/release-manifest.bundle \
            --certificate-identity "$expected_identity" \
            --certificate-oidc-issuer "$oidc_issuer" \
            deploy/release-manifest.json

      - name: Upload release manifest artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: |
            deploy/release-manifest.json
            deploy/release-manifest.bundle

  deploy:
    name: Deploy to VPS
    timeout-minutes: 30
    needs: [production-state, verify, build-frontend-image, build-gateway-image, build-worker-image, build-dbtool-image, build-auth-browser-image, build-tts-gateway-image, scan-and-attest]
    if: always() && needs.scan-and-attest.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-manifest
          path: deploy/
      - name: Recreate signed platform artifact layout
        run: bash deploy/stage-platform-assets.sh
      - name: Install Cosign for staged release acceptance
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: 'v2.4.3'
      - name: Accept exact signed staged release before SSH
        run: |
          set -euo pipefail
          cosign verify-blob --bundle deploy/release-manifest.bundle \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            deploy/release-manifest.json
          bash deploy/verify-manifest.sh --manifest deploy/release-manifest.json \
            --bundle deploy/release-manifest.bundle --deploy-dir deploy \
            --expected-identity "https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main" \
            --expected-issuer https://token.actions.githubusercontent.com --require-cosign
          bash deploy/verify-staged-release.sh --deploy-dir deploy --manifest deploy/release-manifest.json
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          printf 'Host *\n  ServerAliveInterval 15\n  ServerAliveCountMax 10\n  TCPKeepAlive yes\n  ConnectTimeout 15\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Stage signed release without touching the trusted deployer
        timeout-minutes: 5
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/acb-transaction-webhook' }}
        run: |
          set -euo pipefail
          release_id="$(python3 -c 'import json; print(json.load(open("deploy/release-manifest.json"))["release_id"])')"
          [[ "$release_id" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "Invalid release ID" >&2; exit 1; }
          remote_release="$DEPLOY_PATH/releases/$release_id"
          remote_stage="$DEPLOY_PATH/releases/.${release_id}.upload-${{ github.run_id }}-${{ github.run_attempt }}"
          printf 'REMOTE_RELEASE_DIR=%s\n' "$remote_release" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "set -e; mkdir -p '$DEPLOY_PATH/releases'; mkdir -m 0700 '$remote_stage'"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 -r \
            deploy/. "$VPS_USER@$VPS_HOST:$remote_stage/"
          cosign_version="v2.4.3"
          target_arch="$(ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" 'uname -m')"
          case "$target_arch" in
            x86_64|amd64) cosign_asset="cosign-linux-amd64" ;;
            aarch64|arm64) cosign_asset="cosign-linux-arm64" ;;
            *) printf 'Unsupported VPS architecture for Cosign: %s\n' "$target_arch" >&2; exit 1 ;;
          esac
          cosign_bin="$RUNNER_TEMP/$cosign_asset"
          cosign_checksums="$RUNNER_TEMP/cosign_checksums.txt"
          curl --fail --location --retry 5 --retry-delay 2 --retry-connrefused \
            --output "$cosign_bin" "https://github.com/sigstore/cosign/releases/download/${cosign_version}/${cosign_asset}"
          curl --fail --location --retry 5 --retry-delay 2 --retry-connrefused \
            --output "$cosign_checksums" "https://github.com/sigstore/cosign/releases/download/${cosign_version}/cosign_checksums.txt"
          grep "  ${cosign_asset}$" "$cosign_checksums" | (cd "$RUNNER_TEMP" && sha256sum --check -)
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$cosign_bin" "$VPS_USER@$VPS_HOST:$remote_stage/cosign.verified"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "set -e; mkdir -p '$DEPLOY_PATH/deploy'; install -m 0755 '$remote_stage/cosign.verified' '$DEPLOY_PATH/deploy/cosign'; rm -f '$remote_stage/cosign.verified'"
          expected_identity="https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "STAGE='$remote_stage' RELEASE='$remote_release' SIGNER='$expected_identity' DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          export PATH="$DEPLOY_PATH/deploy:$PATH"
          export DEPLOY_PATH
          cosign verify-blob --bundle "$STAGE/release-manifest.bundle" \
            --certificate-identity "$SIGNER" --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$STAGE/release-manifest.json" >/dev/null
          bash "$STAGE/stage-immutable-release.sh" --staging-dir "$STAGE" \
            --release-dir "$RELEASE" --expected-identity "$SIGNER" --require-cosign
          REMOTE
      - name: Deploy immutable image
        timeout-minutes: 20
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/acb-transaction-webhook' }}
          DASHBOARD_OWNER_EMAIL: ${{ vars.DASHBOARD_OWNER_EMAIL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$DASHBOARD_OWNER_EMAIL" ]] || { printf 'DASHBOARD_OWNER_EMAIL is required.\n' >&2; exit 1; }
          owner="$(printf '%s' "$DASHBOARD_OWNER_EMAIL" | tr '[:upper:]' '[:lower:]')"
          expected_identity="https://github.com/${{ github.repository }}/.github/workflows/deploy.yml@refs/heads/main"
          expected_issuer="https://token.actions.githubusercontent.com"
          [[ -n "${REMOTE_RELEASE_DIR:-}" ]] || { printf 'REMOTE_RELEASE_DIR is missing.\n' >&2; exit 1; }
          remote_docker_config="$DEPLOY_PATH/releases/.docker-auth-${{ github.run_id }}-${{ github.run_attempt }}"
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "set -euo pipefail; mkdir -m 0700 -p '$remote_docker_config'; DOCKER_CONFIG='$remote_docker_config' docker login ghcr.io --username '$GHCR_USER' --password-stdin >/dev/null"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_DIR='$REMOTE_RELEASE_DIR' OWNER='$owner' EXPECTED_IDENTITY='$expected_identity' EXPECTED_ISSUER='$expected_issuer' DOCKER_CONFIG='$remote_docker_config' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT INT TERM
          export PATH="$DEPLOY_PATH/deploy:$PATH"
          env_file="$DEPLOY_PATH/deploy/.env.production"
          [[ -f "$env_file" ]] || { printf 'Missing canonical production env file: %s\n' "$env_file" >&2; exit 1; }
          chmod 600 "$env_file"
          [[ -d "$DEPLOY_PATH/deploy/secrets" ]] || { printf 'Missing production secrets directory.\n' >&2; exit 1; }
          chmod 700 "$DEPLOY_PATH/deploy/secrets"
          for secret_file in "$DEPLOY_PATH/deploy/secrets"/*; do
            [[ -f "$secret_file" && ! -L "$secret_file" ]] || continue
            case "$(basename "$secret_file")" in
              bark_basic_auth_user|bark_basic_auth_password) ;;
              *) chmod 600 "$secret_file" ;;
            esac
          done
          [[ -f "$DEPLOY_PATH/deploy/.release.env" ]] || { printf 'Missing canonical release environment.\n' >&2; exit 1; }
          cosign verify-blob --bundle "$RELEASE_DIR/release-manifest.bundle" \
            --certificate-identity "$EXPECTED_IDENTITY" --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            "$RELEASE_DIR/release-manifest.json" >/dev/null
          read -r expected_base_sha expected_base_generation < <(python3 - "$RELEASE_DIR/release-manifest.json" <<'PY'
          import json, sys
          base = json.load(open(sys.argv[1], encoding='utf-8'))['base']
          print(base['git_sha'], base['generation'])
          PY
          )
          export EXPECTED_BASE_SHA="$expected_base_sha" EXPECTED_BASE_GENERATION="$expected_base_generation"
          bootstrap_cmd="$RELEASE_DIR/bootstrap-deployment-engine.sh"
          if [[ ! -f "$bootstrap_cmd" ]]; then
            bootstrap_cmd="$DEPLOY_PATH/deploy/bootstrap-deployment-engine.sh"
          fi
          bash "$bootstrap_cmd" \
            --release-dir "$RELEASE_DIR" --runtime-deploy-dir "$DEPLOY_PATH/deploy" \
            --expected-identity "$EXPECTED_IDENTITY" --expected-issuer "$EXPECTED_ISSUER" --require-cosign --no-reconcile
          preflight_runtime="$DEPLOY_PATH/deploy/preflight-runtime.sh"
          [[ -x "$preflight_runtime" ]] || {
            echo "Bootstrapped preflight-runtime.sh is missing or not executable" >&2
            exit 1
          }
          bash "$DEPLOY_PATH/deploy/preflight-runtime.sh" --check-only \
            --state "$DEPLOY_PATH/state/current-release.json" \
            --expected-base-sha "$expected_base_sha" --expected-base-generation "$expected_base_generation"
          bash "$RELEASE_DIR/verify-release-baseline.sh" \
            --manifest "$RELEASE_DIR/release-manifest.json" --state "$DEPLOY_PATH/state/current-release.json"
          chmod 600 "$DEPLOY_PATH/deploy/.release.env"
          mkdir -p "$RELEASE_DIR/secrets"
          for s in "$DEPLOY_PATH/deploy/secrets"/*; do
            if [[ -f "$s" ]]; then
              ln -sf "$s" "$RELEASE_DIR/secrets/$(basename "$s")" 2>/dev/null || \
              cp -f "$s" "$RELEASE_DIR/secrets/$(basename "$s")" 2>/dev/null || true
            fi
          done
          read -r candidate_images < <(python3 - "$RELEASE_DIR/release-manifest.json" <<'PY'
          import json, sys

          manifest = json.load(open(sys.argv[1], encoding='utf-8'))
          promotion = manifest.get('promotion')
          scope = manifest.get('promotion_scope')
          images = manifest.get('images')

          if not isinstance(promotion, dict) or not all(
              isinstance(v, bool) for v in promotion.values()
          ):
              raise SystemExit(
                  'release manifest promotion must be an object of booleans'
              )

          if not isinstance(scope, list) or not all(
              isinstance(v, str) for v in scope
          ):
              raise SystemExit(
                  'release manifest promotion_scope must be an array of strings'
              )

          if not isinstance(images, dict):
              raise SystemExit(
                  'release manifest images must be an object'
              )

          enabled = {
              component
              for component, is_enabled in promotion.items()
              if is_enabled
          }

          scope_set = set(scope)

          if len(scope_set) != len(scope):
              raise SystemExit(
                  'release manifest promotion_scope contains duplicate components'
              )

          if enabled != scope_set:
              raise SystemExit(
                  'release manifest promotion and promotion_scope disagree'
              )

          image_keys = {
              'schema': 'dbtool',
              'worker': 'worker',
              'gateway': 'gateway',
              'frontend': 'frontend',
              'auth_browser': 'auth_browser',
              'tts': 'tts',
              'bark': 'bark',
          }

          non_image_components = {
              'failover_controller',
              'platform',
          }

          unknown = scope_set - set(image_keys) - non_image_components

          if unknown:
              raise SystemExit(
                  'release manifest contains unsupported promoted component(s): '
                  + ','.join(sorted(unknown))
              )

          pulls = []

          for component, image_key in image_keys.items():
              if component in scope_set:
                  image = images.get(image_key)

                  if not image:
                      raise SystemExit(
                          f'missing image for promoted component '
                          f'{component}: {image_key}'
                      )

                  pulls.append(image)

          print(' '.join(pulls))
          PY
          )
          for img in $candidate_images; do
            [[ -n "$img" ]] || continue
            printf '[INFO] Pre-pulling candidate image: %s\n' "$img"
            docker pull "$img"
          done
          export DEPLOY_PATH
          export DASHBOARD_OWNER_EMAIL="$OWNER"
          export PATH="$DEPLOY_PATH/deploy:$PATH"
          deployer_cmd="$DEPLOY_PATH/deploy/stable-deployer.sh"
          if [[ ! -f "$deployer_cmd" ]]; then
            deployer_cmd="$RELEASE_DIR/stable-deployer.sh"
          fi
          exec "$deployer_cmd" \
            --release-dir "$RELEASE_DIR" \
            --data-dir "$DEPLOY_PATH/data" \
            --expected-identity "$EXPECTED_IDENTITY" \
            --expected-issuer "$EXPECTED_ISSUER" \
            --soak-seconds 900
          REMOTE
      - name: Cleanup temporary registry auth on VPS
        if: always()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/acb-transaction-webhook' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" "rm -rf '$DEPLOY_PATH/releases/.docker-auth-${{ github.run_id }}-${{ github.run_attempt }}'" || true
