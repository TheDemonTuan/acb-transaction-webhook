name: Build and deploy gateway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the immutable image to the configured VPS
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: acb-transaction-webhook-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build and test frontend with Bun
        working-directory: web
        run: |
          bunx --bun tsc --noEmit
          bunx --bun vite build
          bunx --bun vitest run
      - name: Test Go gateway
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test TTS Gateway
        working-directory: tts-gateway
        run: |
          pip install -r requirements.txt
          pytest -v
      - name: Verify deployment scripts
        run: bash -n deploy/*.sh
      - name: Check generated source and whitespace
        run: git diff --check

  build-gateway-image:
    name: Build gateway GHCR image
    needs: verify
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  build-auth-browser-image:
    name: Build auth-browser GHCR image
    needs: verify
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}-auth-browser" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.auth-browser
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Smoke test published auth-browser image
        env:
          AUTH_BROWSER_IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: bash deploy/smoke-test-auth-browser.sh "$AUTH_BROWSER_IMAGE"

  build-tts-gateway-image:
    name: Build tts-gateway GHCR image
    needs: verify
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo_lc}-tts-gateway" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ./tts-gateway
          file: tts-gateway/Dockerfile
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Smoke test published tts-gateway image
        env:
          TTS_GATEWAY_IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: bash deploy/smoke-test-tts-gateway.sh "$TTS_GATEWAY_IMAGE"

  deploy:
    name: Deploy to VPS
    needs: [verify, build-gateway-image, build-auth-browser-image, build-tts-gateway-image]
    if: github.event_name == 'push' || inputs.deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Sync deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/acb-transaction-webhook' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH/data' '$DEPLOY_PATH/secrets'"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes \
            deploy/compose.prod.yaml "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/compose.prod.yaml.next"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes \
            deploy/seccomp-auth-browser.json deploy/deploy.sh deploy/rollback.sh \
            deploy/verify-deployment.sh deploy/backup.sh deploy/bark-entrypoint.sh \
            deploy/smoke-test-bark.sh deploy/README.md \
            "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "chmod 755 '$DEPLOY_PATH/'*.sh"
      - name: Deploy immutable image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/acb-transaction-webhook' }}
          DASHBOARD_OWNER_EMAIL: ${{ vars.DASHBOARD_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          [[ -n "$DASHBOARD_OWNER_EMAIL" ]] || { printf 'DASHBOARD_OWNER_EMAIL is required.\n' >&2; exit 1; }
          image="${{ needs.build-gateway-image.outputs.image }}@${{ needs.build-gateway-image.outputs.digest }}"
          browser_image="${{ needs.build-auth-browser-image.outputs.image }}@${{ needs.build-auth-browser-image.outputs.digest }}"
          tts_image="${{ needs.build-tts-gateway-image.outputs.image }}@${{ needs.build-tts-gateway-image.outputs.digest }}"
          owner="$(printf '%s' "$DASHBOARD_OWNER_EMAIL" | tr '[:upper:]' '[:lower:]')"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "DEPLOY_PATH='$DEPLOY_PATH' OWNER='$owner' IMAGE='$image' BROWSER_IMAGE='$browser_image' TTS_IMAGE='$tts_image' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          env_file="$DEPLOY_PATH/.env.production"
          [[ -f "$env_file" ]] || { printf 'Missing production env file: %s\n' "$env_file" >&2; exit 1; }
          tmp="$(mktemp "${env_file}.XXXXXX")"
          staged_compose="$DEPLOY_PATH/compose.prod.yaml.next"
          [[ -f "$staged_compose" ]] || { printf 'Missing staged compose file: %s\n' "$staged_compose" >&2; exit 1; }
          trap 'rm -f "$tmp"' EXIT
          grep -v -E '^(OWNER_SUBJECTS|CLOUDFLARE_ACCESS_OWNER_EMAIL)=' "$env_file" > "$tmp" || true
          printf 'OWNER_SUBJECTS=%s\n' "$OWNER" >> "$tmp"
          chmod 600 "$tmp"
          mv "$tmp" "$env_file"
          if [[ -d "$DEPLOY_PATH/secrets/tts_internal_token" ]]; then
            rmdir "$DEPLOY_PATH/secrets/tts_internal_token" 2>/dev/null || rm -rf "$DEPLOY_PATH/secrets/tts_internal_token" 2>/dev/null || docker run --rm --user 0:0 -v "$DEPLOY_PATH/secrets:/s" --entrypoint /bin/sh "$TTS_IMAGE" -c 'rm -rf /s/tts_internal_token' 2>/dev/null || true
          fi
          if [[ -d "$DEPLOY_PATH/secrets/app_master_key" ]]; then
            rmdir "$DEPLOY_PATH/secrets/app_master_key" 2>/dev/null || rm -rf "$DEPLOY_PATH/secrets/app_master_key" 2>/dev/null || docker run --rm --user 0:0 -v "$DEPLOY_PATH/secrets:/s" --entrypoint /bin/sh "$TTS_IMAGE" -c 'rm -rf /s/app_master_key' 2>/dev/null || true
          fi
          cd "$DEPLOY_PATH"
          export IMAGE_REF="$IMAGE"
          export AUTH_BROWSER_IMAGE_REF="$BROWSER_IMAGE"
          export TTS_GATEWAY_IMAGE_REF="$TTS_IMAGE"
          timeout 300 ./deploy.sh "$IMAGE" "$BROWSER_IMAGE" "$TTS_IMAGE" "$staged_compose"
          REMOTE
