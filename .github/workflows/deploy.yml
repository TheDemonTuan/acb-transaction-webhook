name: Build and deploy gateway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Components to build (auto compares with the last successful main push)
        type: choice
        required: true
        default: all
        options: [auto, all, frontend, backend]
      deploy:
        description: Deploy selected backend to production (frontend artifacts publish centrally)
        type: boolean
        required: true
        default: false
      import_account:
        description: Optional owner-approved correction of the initial import-only account file (never DB credentials)
        type: string
        required: false
        default: ''
      rehearse:
        description: Optionally run lifecycle and fault-matrix rehearsal before deployment
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: acb-transaction-webhook-production
  cancel-in-progress: false

jobs:
  changes:
    name: Select release components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      backend: ${{ steps.select.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Classify changes and validate dispatch
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 deploy/classify-changes.py

  verify:
    uses: ./.github/workflows/ci.yml
  verify-contract:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require full reusable CI success
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success

  build:
    needs: [changes, verify, verify-contract]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.backend == 'true' && needs.verify.result == 'success' && needs.verify-contract.result == 'success'
    name: Build ${{ matrix.component }} (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: gateway, context: '.', dockerfile: Dockerfile, target: gateway, suffix: '', key: GATEWAY_IMAGE_REF}
          - {component: worker, context: '.', dockerfile: Dockerfile, target: worker, suffix: '-worker', key: WORKER_IMAGE_REF}
          - {component: dbtool, context: '.', dockerfile: Dockerfile, target: dbtool, suffix: '-dbtool', key: DBTOOL_IMAGE_REF}
          - {component: auth-browser, context: '.', dockerfile: Dockerfile.auth-browser, target: '', suffix: '-auth-browser', key: BROWSER_IMAGE_REF}
          - {component: tts-gateway, context: tts-gateway, dockerfile: tts-gateway/Dockerfile, target: '', suffix: '-tts-gateway', key: TTS_IMAGE_REF}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve existing SHA tag
        id: existing
        env:
          COMPONENT: ${{ matrix.component }}
          SUFFIX: ${{ matrix.suffix }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${REPO,,}${SUFFIX}"
          tag="$repo:sha-$GITHUB_SHA"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$tag" > "$RUNNER_TEMP/manifest.txt" 2> "$RUNNER_TEMP/inspect.err"; then
            digest="$(python3 - "$RUNNER_TEMP/manifest.txt" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8').read()
          matches=re.findall(r'^Digest:\s*(sha256:[a-f0-9]{64})\s*$',text,re.M)
          if len(matches)!=1: raise SystemExit('Missing or ambiguous manifest digest')
          print(matches[0])
          PY
          )"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
            docker pull --platform linux/arm64 "$repo@$digest"
            [[ "$(docker image inspect --format '{{.Architecture}}' "$repo@$digest")" == arm64 ]] || exit 1
            [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$repo@$digest")" == "$GITHUB_SHA" ]] || { echo "Existing tag has wrong revision" >&2; exit 1; }
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          elif grep -Fxq "ERROR: $tag: not found" "$RUNNER_TEMP/inspect.err" || grep -Eiq 'manifest unknown|manifest not found|name unknown|not found: manifest' "$RUNNER_TEMP/inspect.err"; then
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          fi
      - uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        id: built
        if: steps.existing.outputs.reuse == 'false'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.existing.outputs.repo }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            RELEASE_COMMIT=${{ github.sha }}
      - name: Publish immutable ref
        env:
          REPO: ${{ steps.existing.outputs.repo }}
          KEY: ${{ matrix.key }}
          EXISTING: ${{ steps.existing.outputs.digest }}
          BUILT: ${{ steps.built.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING:-$BUILT}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          printf '%s=%s@%s\n' "$KEY" "$REPO" "$digest" > "image-ref-${{ matrix.component }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-ref-${{ matrix.component }}
          path: image-ref-${{ matrix.component }}
          if-no-files-found: error
          retention-days: 3

  scan:
    needs: [changes, build]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.backend == 'true' && needs.build.result == 'success'
    name: Scan immutable images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-ref-*
          merge-multiple: true
          path: image-refs
      - name: Assemble immutable images.env
        env:
          BARK_IMAGE_REF: ${{ vars.BARK_IMAGE_REF }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_SHA" "$BARK_IMAGE_REF" <<'PY'
          import pathlib,re,sys
          sha,bark=sys.argv[1:]
          names={'gateway':'GATEWAY_IMAGE_REF','worker':'WORKER_IMAGE_REF','dbtool':'DBTOOL_IMAGE_REF','auth-browser':'BROWSER_IMAGE_REF','tts-gateway':'TTS_IMAGE_REF'}
          digest=re.compile(r'ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}\Z')
          if not re.fullmatch(r'[a-f0-9]{40}',sha) or not digest.fullmatch(bark): raise SystemExit('Invalid release SHA or Bark digest')
          lines=[f'RELEASE_SHA={sha}']
          for component,key in names.items():
              path=pathlib.Path('image-refs')/f'image-ref-{component}'
              items=path.read_text().splitlines()
              if len(items)!=1 or not items[0].startswith(key+'=') or not digest.fullmatch(items[0].split('=',1)[1]): raise SystemExit(f'Invalid artifact: {component}')
              lines.extend(items)
          lines.append('BARK_IMAGE_REF='+bark)
          pathlib.Path('images.env').write_text('\n'.join(lines)+'\n')
          PY
      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --location --retry 3 --output "$archive" "$base/$archive"
          curl --fail --location --retry 3 --output trivy-checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "  $archive$" trivy-checksums.txt | sha256sum --check -
          tar -xzf "$archive" trivy
          install -m 0755 trivy "$RUNNER_TEMP/trivy"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate security policies and scan
        run: |
          set -euo pipefail
          mkdir -p security-reports sbom-artifacts
          bash deploy/verify-third-party-policy.sh --image "$(sed -n 's/^BARK_IMAGE_REF=//p' images.env)" --allowlist deploy/third-party-allowlist.json
          for component in gateway worker dbtool auth-browser tts-gateway bark; do
            case "$component" in
              gateway) key=GATEWAY_IMAGE_REF ;;
              worker) key=WORKER_IMAGE_REF ;;
              dbtool) key=DBTOOL_IMAGE_REF ;;
              auth-browser) key=BROWSER_IMAGE_REF ;;
              tts-gateway) key=TTS_IMAGE_REF ;;
              bark) key=BARK_IMAGE_REF ;;
            esac
            image="$(sed -n "s/^${key}=//p" images.env)"
            [[ "$image" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]] || exit 1
            trivy image --platform linux/arm64 --scanners vuln --format json --output "security-reports/trivy-${component}.json" "$image"
            trivy image --platform linux/arm64 --format cyclonedx --output "sbom-artifacts/sbom-${component}.cdx.json" "$image"
            if [[ "$component" == bark ]]; then
              trivy image --platform linux/arm64 --scanners vuln --exit-code 1 --severity CRITICAL "$image"
            else
              bash deploy/validate-cve-allowlist.sh --file deploy/cve-allowlist.json --component "$component" --output-ignorefile ".trivyignore-${component}"
              trivy image --platform linux/arm64 --scanners vuln --exit-code 1 --severity HIGH,CRITICAL --ignorefile ".trivyignore-${component}" "$image"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-artifacts
          path: |
            security-reports/
            sbom-artifacts/
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-images
          path: images.env
          if-no-files-found: error
          retention-days: 3

  rehearsal:
    needs: [changes, scan]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.backend == 'true' && needs.scan.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.rehearse == true
    name: Rehearsal (${{ matrix.suite }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        suite: [lifecycle, fault-matrix]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images
          path: bundle
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Rehearse real deploy and rollback on isolated runner (${{ matrix.suite }})
        run: |
          set -euo pipefail
          files=(deploy.sh simple-lib.sh healthcheck.sh render-route.sh backup-db.sh migrate-static-hosting.py acb-route-publish.py install-route-publisher.sh setup-recovery.sh setup-recovery.py compose.prod.yaml compose.auth-recovery-ai.yaml seccomp-auth-browser.json bark-entrypoint.sh images.env)
          for file in "${files[@]}"; do
            [[ "$file" == images.env ]] || cp "deploy/$file" "bundle/$file"
          done
          # Harness switches to app UID 1000; keep .git credentials private.
          chmod a+r bundle/* deploy/tests/test_simple_deploy.sh platform/edge/dynamic/acb.yml
          chmod a+x bundle/{deploy.sh,healthcheck.sh,render-route.sh,backup-db.sh,migrate-static-hosting.py,acb-route-publish.py,install-route-publisher.sh,setup-recovery.sh,setup-recovery.py,bark-entrypoint.sh}
          chmod 644 bundle/{compose.prod.yaml,compose.auth-recovery-ai.yaml}
          (cd bundle && sha256sum "${files[@]}" > SHA256SUMS)
          chmod a+r bundle/SHA256SUMS
          chmod a+rx bundle deploy deploy/tests platform platform/edge platform/edge/dynamic
          path="$GITHUB_WORKSPACE"
          while [[ "$path" != / ]]; do
            sudo -u '#1000' test -x "$path" || sudo chmod a+x "$path"
            path="$(dirname "$path")"
          done
          bash deploy/tests/test_simple_deploy.sh --images-env "$PWD/bundle/images.env" --bundle "$PWD/bundle" --suite "${{ matrix.suite }}"

  verified-bundle:
    needs: [changes, scan, rehearsal]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.backend == 'true' && needs.scan.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.rehearse == true && needs.rehearsal.result == 'success') || (!(github.event_name == 'workflow_dispatch' && inputs.rehearse == true) && needs.rehearsal.result == 'skipped'))
    name: Package verified bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require image scan and requested rehearsal results
        env:
          SCAN: ${{ needs.scan.result }}
          REHEARSAL: ${{ needs.rehearsal.result }}
        run: test "$SCAN" = success && { if [[ '${{ github.event_name }}' == workflow_dispatch && '${{ inputs.rehearse }}' == true ]]; then test "$REHEARSAL" = success; else test "$REHEARSAL" = skipped; fi; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-images
          path: bundle
      - name: Assemble verified bundle
        run: |
          set -euo pipefail
          files=(deploy.sh simple-lib.sh healthcheck.sh render-route.sh backup-db.sh migrate-static-hosting.py acb-route-publish.py install-route-publisher.sh setup-recovery.sh setup-recovery.py compose.prod.yaml compose.auth-recovery-ai.yaml seccomp-auth-browser.json bark-entrypoint.sh images.env)
          for file in "${files[@]}"; do
            [[ "$file" == images.env ]] || cp "deploy/$file" "bundle/$file"
          done
          chmod 700 bundle/{deploy.sh,simple-lib.sh,healthcheck.sh,render-route.sh,backup-db.sh,migrate-static-hosting.py,acb-route-publish.py,install-route-publisher.sh,setup-recovery.sh,setup-recovery.py}
          chmod 644 bundle/{bark-entrypoint.sh,compose.prod.yaml,compose.auth-recovery-ai.yaml,seccomp-auth-browser.json,images.env}
          (cd bundle && sha256sum "${files[@]}" > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: [changes, verify, verify-contract, build, scan, verified-bundle]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.backend == 'true' && needs.verify.result == 'success' && needs.verify-contract.result == 'success' && needs.build.result == 'success' && needs.scan.result == 'success' && needs.verified-bundle.result == 'success' && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || inputs.deploy == true)
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-bundle
          path: bundle
      - name: Validate bundle and configure SSH
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/bank-event-gateway' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != *..* ]] || exit 1
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ && "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]] || exit 1
          mkdir -m 700 -p ~/.ssh
          (umask 077; printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts)
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          files=(deploy.sh simple-lib.sh healthcheck.sh render-route.sh backup-db.sh migrate-static-hosting.py acb-route-publish.py install-route-publisher.sh setup-recovery.sh setup-recovery.py compose.prod.yaml compose.auth-recovery-ai.yaml seccomp-auth-browser.json bark-entrypoint.sh images.env)
          for file in "${files[@]}"; do [[ -s "bundle/$file" ]] || { echo "Missing $file" >&2; exit 1; }; done
          chmod 700 bundle/{deploy.sh,simple-lib.sh,healthcheck.sh,render-route.sh,backup-db.sh,migrate-static-hosting.py,acb-route-publish.py,install-route-publisher.sh,setup-recovery.sh,setup-recovery.py,bark-entrypoint.sh}
          (cd bundle && sha256sum -c SHA256SUMS)
      - name: Stage and deploy one immutable bundle
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/opt/bank-event-gateway' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_OWNER_EMAIL: ${{ vars.DASHBOARD_OWNER_EMAIL }}
          RECOVERY_IMPORT_ACCOUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.import_account || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$RECOVERY_IMPORT_ACCOUNT" ]]; then
            [[ "$RECOVERY_IMPORT_ACCOUNT" =~ ^[0-9]{1,32}$ ]] || { echo 'INVALID_IMPORT_ACCOUNT' >&2; exit 1; }
            printf '::add-mask::%s\n' "$RECOVERY_IMPORT_ACCOUNT"
          fi
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -p "$VPS_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=10)
          remote="$VPS_USER@$VPS_HOST"
          stage="$DEPLOY_PATH/releases/.stage-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "${ssh_opts[@]}" "$remote" "umask 077; mkdir -p '$DEPLOY_PATH/releases' '$stage'"
          trap 'ssh "${ssh_opts[@]}" "$remote" "rm -rf '\''$stage'\''" || true' EXIT
          scp -i "$HOME/.ssh/id_ed25519" -P "$VPS_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 bundle/{deploy.sh,simple-lib.sh,healthcheck.sh,render-route.sh,backup-db.sh,migrate-static-hosting.py,acb-route-publish.py,install-route-publisher.sh,setup-recovery.sh,setup-recovery.py,compose.prod.yaml,compose.auth-recovery-ai.yaml,seccomp-auth-browser.json,bark-entrypoint.sh,images.env,SHA256SUMS} "$remote:$stage/"
          [[ "$DASHBOARD_OWNER_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+$ ]] || { echo "Invalid dashboard owner email" >&2; exit 1; }
          { printf '%s\n%s\n' "$GH_TOKEN" "$RECOVERY_IMPORT_ACCOUNT"; cat <<'REMOTE'
          set -euo pipefail
          target="$DEPLOY_PATH/releases/$SHA"
          (cd "$STAGE" && sha256sum -c SHA256SUMS)
          chmod 700 "$STAGE"/{deploy.sh,simple-lib.sh,healthcheck.sh,render-route.sh,backup-db.sh,migrate-static-hosting.py,acb-route-publish.py,install-route-publisher.sh,setup-recovery.sh,setup-recovery.py}
          chmod 644 "$STAGE"/{bark-entrypoint.sh,compose.prod.yaml,compose.auth-recovery-ai.yaml,seccomp-auth-browser.json,images.env,SHA256SUMS}
          if [[ -e "$target" ]]; then
            (cd "$target" && sha256sum -c "$STAGE/SHA256SUMS")
            cmp "$target/SHA256SUMS" "$STAGE/SHA256SUMS"
          else
            mv "$STAGE" "$target"
          fi
          auth="$(mktemp -d "$DEPLOY_PATH/.docker-auth.XXXXXXXX")"
          chmod 700 "$auth"
          trap 'rm -rf "$auth"' EXIT
          printf '%s' "$GH_TOKEN" | DOCKER_CONFIG="$auth" docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          unset GH_TOKEN
          if [[ -n "$RECOVERY_IMPORT_ACCOUNT" ]]; then
            (
              exec 8>"$DEPLOY_PATH/.recovery-setup.lock"
              flock -w 30 8 || { echo 'Recovery setup lock unavailable' >&2; exit 1; }
              exec 9>"$DEPLOY_PATH/.deploy.lock"
              flock -w 30 9 || { echo 'Deploy lock unavailable for import repair' >&2; exit 1; }
              python3 - <<'PY'
          import os, re, stat, tempfile
          from pathlib import Path
          account = os.environ['RECOVERY_IMPORT_ACCOUNT']
          if not re.fullmatch(r'[0-9]{1,32}', account):
              raise SystemExit('INVALID_IMPORT_ACCOUNT')
          directory = Path(os.environ['DEPLOY_PATH']) / 'deploy' / 'secrets'
          st = directory.lstat()
          if not stat.S_ISDIR(st.st_mode) or (stat.S_IMODE(st.st_mode), st.st_uid, st.st_gid) != (0o700, 1000, 1000):
              raise SystemExit('CREDENTIAL_IMPORT_DIRECTORY_INVALID')
          destination = directory / 'acb_account'
          st = destination.lstat()
          if not stat.S_ISREG(st.st_mode) or (stat.S_IMODE(st.st_mode), st.st_uid, st.st_gid) != (0o600, 1000, 1000):
              raise SystemExit('CREDENTIAL_IMPORT_FILE_INVALID')
          fd, temporary = tempfile.mkstemp(prefix='.account-import-', dir=directory)
          try:
              os.fchmod(fd, 0o600)
              os.fchown(fd, 1000, 1000)
              with os.fdopen(fd, 'w', encoding='ascii') as stream:
                  stream.write(account + '\n')
                  stream.flush()
                  os.fsync(stream.fileno())
              os.replace(temporary, destination)
              directory_fd = os.open(directory, os.O_DIRECTORY)
              try:
                  os.fsync(directory_fd)
              finally:
                  os.close(directory_fd)
          finally:
              if os.path.exists(temporary):
                  os.unlink(temporary)
          print('IMPORT_ACCOUNT_FILE_UPDATED; DB account and session unchanged; importer verification remains required')
          PY
            )
          fi
          unset RECOVERY_IMPORT_ACCOUNT
          DEPLOY_PATH="$DEPLOY_PATH" DOCKER_CONFIG="$auth" DASHBOARD_OWNER_EMAIL="$DASHBOARD_OWNER_EMAIL" bash "$target/deploy.sh" "$SHA"
          # Fence publication against another deploy/rollback after deploy.sh releases its lock.
          exec 9>"$DEPLOY_PATH/.deploy.lock"
          flock -w 30 9 || { echo 'Setup publication lock unavailable' >&2; exit 1; }
          committed="$(sed -n 's/^RELEASE_SHA=//p' "$DEPLOY_PATH/state.env")"
          gateway="$(sed -n 's/^GATEWAY_SLOT=//p' "$DEPLOY_PATH/state.env")"
          [[ "$committed" == "$SHA" && "$gateway" =~ ^(blue|green)$ ]] || { echo 'Commit postcondition failed' >&2; exit 1; }
          DEPLOY_PATH="$DEPLOY_PATH" DOCKER_CONFIG="$auth" bash "$target/healthcheck.sh" route "$gateway" "$SHA"
          python3 - "$DEPLOY_PATH" "$target/setup-recovery.sh" <<'PY'
          import os,secrets,sys
          root,target=sys.argv[1:]
          directory=os.path.join(root,'deploy')
          temporary=os.path.join(directory,'.setup-recovery.'+secrets.token_hex(16)+'.tmp')
          try:
              os.symlink(target,temporary)
              os.replace(temporary,os.path.join(directory,'setup-recovery.sh'))
              fd=os.open(directory,os.O_DIRECTORY)
              try: os.fsync(fd)
              finally: os.close(fd)
          finally:
              if os.path.lexists(temporary): os.unlink(temporary)
          PY
          printf 'DEPLOY_SUMMARY: Recovery setup: sudo bash %s/deploy/setup-recovery.sh\n' "$DEPLOY_PATH"
          printf 'DEPLOY_SUMMARY: Requested SHA: %s\nDEPLOY_SUMMARY: Committed SHA: %s\nDEPLOY_SUMMARY: Gateway slot: %s\n' "$SHA" "$committed" "$gateway"
          while IFS= read -r line; do
            [[ "$line" =~ ^(GATEWAY|WORKER|DBTOOL|BROWSER|TTS|BARK)_IMAGE_REF=ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]] || continue
            printf 'DEPLOY_SUMMARY: %s\n' "$line"
          done < "$target/images.env"
          if [[ -s "$target/backup-receipt-path" ]]; then
            receipt="$(cat "$target/backup-receipt-path")"
            [[ "$receipt" == "$DEPLOY_PATH/data/backups/"* ]] || exit 1
            printf 'DEPLOY_SUMMARY: Backup receipt: %s\n' "$receipt"
          else
            printf 'DEPLOY_SUMMARY: Backup receipt: none (no new snapshot)\n'
          fi
          printf 'DEPLOY_SUMMARY: Internal ACK: passed\nDEPLOY_SUMMARY: Public smoke: passed\nDEPLOY_SUMMARY: Rollback: not required\n'
          REMOTE
          } | ssh "${ssh_opts[@]}" "$remote" "read -r GH_TOKEN; read -r RECOVERY_IMPORT_ACCOUNT; export GH_TOKEN RECOVERY_IMPORT_ACCOUNT; DEPLOY_PATH='$DEPLOY_PATH' STAGE='$stage' SHA='$GITHUB_SHA' DASHBOARD_OWNER_EMAIL='$DASHBOARD_OWNER_EMAIL' bash -s" 2>&1 | tee "$RUNNER_TEMP/acb-deploy-output"
          while IFS= read -r line; do
            if [[ "$line" == 'DEPLOY_SUMMARY: '* ]]; then printf '%s\n' "${line#DEPLOY_SUMMARY: }" >> "$GITHUB_STEP_SUMMARY"; fi
          done < "$RUNNER_TEMP/acb-deploy-output"
          trap - EXIT
      - name: Report failed deployment
        if: failure()
        run: |
          printf 'Requested SHA: %s\nDeployment: failed\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$RUNNER_TEMP/acb-deploy-output" ]] && grep -q 'ROLLBACK_FAILED' "$RUNNER_TEMP/acb-deploy-output"; then
            echo 'Rollback: failed; pending evidence preserved' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Rollback: inspect remote deploy log' >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend-build:
    name: Build verified static assets
    needs: [changes, verify, verify-contract]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.frontend == 'true' && needs.verify.result == 'success' && needs.verify-contract.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install exact frontend toolchain
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build release artifact once
        working-directory: web
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: bun run build:cloudflare
      - name: Smoke actual local Wrangler HTTP surface
        run: |
          set -euo pipefail
          (cd web && node node_modules/wrangler/bin/wrangler.js deploy --dry-run)
          (cd web && exec node node_modules/wrangler/bin/wrangler.js dev --local --ip 127.0.0.1 --port 8787) > "$RUNNER_TEMP/wrangler-local.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          python3 - "$pid" "$GITHUB_SHA" <<'PY'
          import os,sys,time,urllib.error,urllib.request
          pid,sha=int(sys.argv[1]),sys.argv[2]
          for _ in range(60):
              os.kill(pid,0)
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8787/__release',timeout=1) as response:
                      if response.read() == (sha+'\n').encode(): break
              except (OSError,urllib.error.URLError): pass
              time.sleep(1)
          else: raise SystemExit('Local Wrangler release did not become ready')
          PY
          python3 deploy/verify-frontend.py --origin http://127.0.0.1:8787 --sha "$GITHUB_SHA" --mode static --surface local --artifact web/dist
      - name: Package immutable frontend artifact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'frontend-artifact'
          root.mkdir()
          source=pathlib.Path('web/dist')
          if any(path.is_symlink() for path in source.rglob('*')): raise SystemExit('Symlinks are not permitted in static assets')
          shutil.copytree(source,root/'dist')
          shutil.copyfile('web/wrangler.jsonc',root/'wrangler.jsonc')
          (root/'release-sha').write_text(os.environ['GITHUB_SHA']+'\n',encoding='ascii')
          manifest={'app':'acb','source_repository':os.environ['GITHUB_REPOSITORY'],'source_sha':os.environ['GITHUB_SHA']}
          (root/'manifest.json').write_text(json.dumps(manifest,sort_keys=True)+'\n',encoding='utf-8')
          files=sorted(path for path in root.rglob('*') if path.is_file())
          (root/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}\n' for path in files),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist-${{ github.sha }}
          path: ${{ runner.temp }}/frontend-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Report artifact handoff (not a production deployment)
        env:
          SOURCE_EVENT: ${{ github.event_name }}
        run: |
          {
            printf '### Frontend artifact built, not deployed\n\n'
            printf 'Artifact: `frontend-dist-%s` (30-day retention). Source run: `%s`.\n\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"
            printf 'Cloudflare credentials and production publishing belong only to `TheDemonTuan/vps-deploy`, environment `production`.\n\n'
            if [[ "$SOURCE_EVENT" == push && "$GITHUB_REF" == refs/heads/main ]]; then
              printf 'Central scheduled publishing considers this artifact only after the **whole source run succeeds**, including the selected backend gates/deployment. This job does not assert it is live.\n\n'
            else
              printf 'Manual source runs do not publish automatically, even with `deploy=true`. After the whole source run succeeds, dispatch centrally:\n\n'
              printf '```sh\ngh workflow run cloudflare-deploy.yml --repo TheDemonTuan/vps-deploy -f app=acb -f mode=publish -f source_run_id=%s\n```\n\n' "$GITHUB_RUN_ID"
            fi
            printf 'Bootstrap and exact-version rollback are central-only operations; frontend-only source runs do not SSH to or mutate the VPS unless `rehearse` or `import_account` selects the backend.\n'
          } >> "$GITHUB_STEP_SUMMARY"

