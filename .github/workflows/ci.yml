name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check generated source and whitespace
        run: git diff --check
      - name: Verify deployment and platform script syntax
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
      - name: Lint deployment and platform scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          shellcheck --severity=error "${scripts[@]}"
      - name: Validate static hosting and payment deployment tooling syntax
        run: python3 -m py_compile deploy/cloudflare-routes.py deploy/verify-frontend.py deploy/classify-changes.py deploy/acb-route-publish.py deploy/migrate-payos-runtime.py deploy/workflow-runtime.py
      - name: Test deployment safety and static hosting contracts
        run: |
          python3 -m pip install PyYAML
          python3 -m unittest discover -s deploy/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tests/integration -p 'test_sepay_telegram_ops.py' -v
      - name: Test root-owned ACB route publisher in isolated directories
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-yaml util-linux
          sudo /usr/bin/python3 -m unittest discover -s deploy/tests -p 'test_route_publisher.py' -v
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build and test frontend with Bun
        working-directory: web
        run: |
          bunx --bun tsc --noEmit
          bunx --bun vite build
          bunx --bun vitest run
      - name: Test Go gateway
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install TTS test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Test TTS Gateway
        working-directory: tts-gateway
        run: |
          pip install -r requirements.lock -r requirements-dev.lock
          pytest -v
      - name: Test failover controller
        run: |
          python3 -m pip install pytest
          python3 -m py_compile platform/failover/vps-failover-controller.py
          python3 -m pytest -q platform/failover/test_failover.py
      - name: Install restore drill dependencies
        run: |
          sudo apt-get install --no-install-recommends -y age sqlite3
      - name: Test encrypted operator backup and restore drill
        run: |
          set -euo pipefail
          path="$GITHUB_WORKSPACE"
          while [[ "$path" != / ]]; do
            sudo -u '#1000' test -x "$path" || sudo chmod a+x "$path"
            path="$(dirname "$path")"
          done
          chmod a+rx deploy deploy/tests scripts scripts/ops
          go build -o "$RUNNER_TEMP/payos-dbtool" ./cmd/dbtool
          chmod a+rx "$RUNNER_TEMP" "$RUNNER_TEMP/payos-dbtool"
          sudo -u '#1000' env DBTOOL_BIN="$RUNNER_TEMP/payos-dbtool" bash deploy/tests/test_restore_drill.sh
      - name: Test supply-chain validators
        run: bash deploy/test-supply-chain.sh

  docker-smoke-gateway:
    name: Docker smoke test (gateway)
    timeout-minutes: 10
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          target: gateway
          push: false
          tags: acb-transaction-webhook:smoke-test
          load: true
      - name: Run gateway boot and storage health smoke (not provider confirmation)
        run: |
          set -euo pipefail
          trap 'docker rm -f smoke-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke-test \
            -e APP_ENV=development \
            -e LISTEN_ADDR=0.0.0.0:8080 \
            -e DATA_DIR=/tmp/data \
            -e PAYMENT_PUBLIC_ORIGIN=http://localhost:8080 \
            acb-transaction-webhook:smoke-test
          for attempt in {1..30}; do
            if docker exec smoke-test /gateway --healthcheck; then exit 0; fi
            [[ "$(docker inspect --format '{{.State.Running}}' smoke-test)" == true ]] || exit 1
            sleep 1
          done
          echo 'Gateway boot/storage health timeout (no provider request or confirmation performed)' >&2
          exit 1

  docker-smoke-tts-gateway:
    name: Docker smoke test (tts-gateway)
    timeout-minutes: 10
    needs: verify
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: ./tts-gateway
          push: false
          tags: acb-tts-gateway:smoke-test
          load: true
      - name: Run tts-gateway image smoke test twice
        run: |
          bash deploy/smoke-test-tts-gateway.sh acb-tts-gateway:smoke-test
          bash deploy/smoke-test-tts-gateway.sh acb-tts-gateway:smoke-test
      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-ARM64.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --fail --location --retry 3 --output "$archive" "$base/$archive"
          curl --fail --location --retry 3 --output trivy-checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep "  $archive$" trivy-checksums.txt | sha256sum --check -
          tar -xzf "$archive" trivy
          install -m 0755 trivy "$RUNNER_TEMP/trivy"
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan tts-gateway image with Trivy
        run: |
          set -euo pipefail
          bash deploy/validate-cve-allowlist.sh \
            --file deploy/cve-allowlist.json \
            --component tts-gateway \
            --output-ignorefile .trivyignore-tts-gateway
          trivy image \
            --platform linux/arm64 \
            --scanners vuln \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignorefile .trivyignore-tts-gateway \
            acb-tts-gateway:smoke-test

  production-contract:
    name: Production Contract
    if: always()
    needs: [verify, docker-smoke-gateway, docker-smoke-tts-gateway]
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Require every production gate
        env:
          VERIFY: ${{ needs.verify.result }}
          GATEWAY: ${{ needs.docker-smoke-gateway.result }}
          TTS: ${{ needs.docker-smoke-tts-gateway.result }}
        run: |
          set -euo pipefail
          for result in "$VERIFY" "$GATEWAY" "$TTS"; do
            [[ "$result" == "success" ]] || { echo "Required production gate did not succeed: $result" >&2; exit 1; }
          done
