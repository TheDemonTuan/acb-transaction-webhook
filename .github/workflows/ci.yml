name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check generated source and whitespace
        run: git diff --check
      - name: Verify deployment and platform script syntax
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
      - name: Lint deployment and platform scripts
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          shellcheck --severity=error "${scripts[@]}"
      - name: Verify architecture documentation
        run: bash scripts/verify-architecture-docs.sh
      - name: Verify GitHub Actions are pinned to full commit SHAs
        run: bash scripts/verify-actions-pinned.sh
      - name: Verify CI workflow timeouts, keepalives, and action pinning
        run: bash deploy/tests/test_ci_workflow.sh
      - name: Verify canonical naming and journal contracts
        run: bash deploy/tests/test_naming_contract.sh
      - name: Test release state schema v2 and compatibility
        run: |
          bash deploy/tests/test_release_state.sh
          bash deploy/tests/test_schema_compatibility.sh
      - name: Test component promotion scope classifier
        run: bash scripts/test-promotion-scope.sh
      - name: Test component map coverage
        run: bash deploy/tests/test_component_map_coverage.sh
      - name: Validate pull request promotion scope diff
        if: github.event_name == 'pull_request'
        run: |
          scripts/compute-promotion-scope.sh \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --format env
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build and test frontend with Bun
        working-directory: web
        run: |
          bunx --bun tsc --noEmit
          bunx --bun vite build
          bunx --bun vitest run
      - name: Test Go gateway
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Test TTS Gateway
        working-directory: tts-gateway
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -v
      - name: Test failover controller
        run: |
          python3 -m pip install pytest
          python3 -m py_compile platform/failover/vps-failover-controller.py
          python3 -m pytest -q platform/failover/test_failover.py
      - name: Test health endpoints, telemetry and operational alerts
        run: bash deploy/tests/test_health_telemetry.sh
      - name: Test promotion dispatcher and rollout orchestration
        run: bash deploy/tests/test_promotion_dispatcher.sh
      - name: Test runtime convergence regression (ordering, TTS mapping, worker quiesce)
        run: bash deploy/tests/test_runtime_convergence_regression.sh
      - name: Run deployment failure drill tests
        run: |
          bash deploy/tests/test_secrets.sh
          bash deploy/tests/test_compose_policy.sh
          bash deploy/tests/test_runtime_policy.sh
          bash deploy/tests/test_gateway_deploy.sh
          bash deploy/tests/test_schema_deploy.sh
          bash deploy/tests/test_worker_deploy.sh
          bash deploy/tests/test_aux_deploy.sh
          bash deploy/tests/test_traefik_switch.sh
          bash deploy/tests/test_deploy_platform.sh
          bash deploy/tests/test_staged_release_compose.sh
          bash deploy/tests/test_canonical_recovery.sh
          bash deploy/tests/test_component_tx_recovery.sh
          bash deploy/tests/test_preflight_vps.sh
          bash deploy/tests/test_deploy_workflow_runtime_preflight.sh
          bash deploy/tests/test_release_baseline.sh
          bash deploy/tests/test_deploy_rerun_contract.sh
          if [[ -f deploy/tests/test_trusted_engine_bootstrap.sh ]]; then bash deploy/tests/test_trusted_engine_bootstrap.sh; fi
          bash deploy/tests/test_release_bundle_runtime_contract.sh
          bash deploy/tests/test_runtime_layout.sh
          bash deploy/tests/test_bootstrap_recovery.sh
          bash deploy/tests/test_legacy_frontend_recovery.sh
          bash deploy/tests/test_release_rollback.sh
          bash deploy/tests/test_slot_resolution.sh
          bash deploy/tests/test_failover_bundle.sh
          bash deploy/tests/test_drift_complete.sh
      - name: Test real-artifact release lifecycle simulator
        run: bash deploy/tests/test_release_simulator.sh
      - name: Test crash recovery and chaos matrix
        run: bash deploy/tests/test_release_crash_recovery.sh
      - name: Install restore drill dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y age sqlite3
      - name: Test backup and restore drill
        run: |
          bash deploy/tests/test_backup.sh
          bash deploy/tests/test_restore_drill.sh
      - name: Test supply-chain validators and release manifest
        run: bash deploy/test-supply-chain.sh

  docker-smoke-gateway:
    name: Docker smoke test (gateway)
    timeout-minutes: 10
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          target: gateway
          push: false
          tags: acb-transaction-webhook:smoke-test
          load: true
      - name: Run gateway image smoke test
        run: |
          docker run -d --name smoke-test \
            -e APP_ENV=development \
            -e LISTEN_ADDR=0.0.0.0:8080 \
            -e DATA_DIR=/tmp/data \
            acb-transaction-webhook:smoke-test
          sleep 2
          docker exec smoke-test /gateway --healthcheck
          docker stop smoke-test
          docker rm -f smoke-test

  docker-smoke-auth-browser:
    name: Docker smoke test (auth-browser)
    timeout-minutes: 10
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          file: Dockerfile.auth-browser
          push: false
          tags: acb-transaction-webhook-auth-browser:smoke-test
          load: true
      - name: Run auth-browser image smoke test
        run: |
          chmod +x deploy/smoke-test-auth-browser.sh
          ./deploy/smoke-test-auth-browser.sh acb-transaction-webhook-auth-browser:smoke-test

  docker-smoke-tts-gateway:
    name: Docker smoke test (tts-gateway)
    timeout-minutes: 10
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: ./tts-gateway
          push: false
          tags: acb-tts-gateway:smoke-test
          load: true
      - name: Run tts-gateway image smoke test
        run: |
          docker run -d --name smoke-test-tts \
            -e TTS_PORT=8081 \
            -p 127.0.0.1:18081:8081 \
            acb-tts-gateway:smoke-test
          trap 'docker rm -f smoke-test-tts >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:18081/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs smoke-test-tts
          exit 1

  production-contract:
    name: Production Contract
    if: always()
    needs: [verify, docker-smoke-gateway, docker-smoke-auth-browser, docker-smoke-tts-gateway]
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Require every production gate
        env:
          VERIFY: ${{ needs.verify.result }}
          GATEWAY: ${{ needs.docker-smoke-gateway.result }}
          AUTH_BROWSER: ${{ needs.docker-smoke-auth-browser.result }}
          TTS: ${{ needs.docker-smoke-tts-gateway.result }}
        run: |
          set -euo pipefail
          for result in "$VERIFY" "$GATEWAY" "$AUTH_BROWSER" "$TTS"; do
            [[ "$result" == "success" ]] || { echo "Required production gate did not succeed: $result" >&2; exit 1; }
          done
