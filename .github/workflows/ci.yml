name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.27.1
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build and test frontend with Bun
        working-directory: web
        run: |
          bunx --bun tsc --noEmit
          bunx --bun vite build
          bunx --bun vitest run
      - name: Test Go gateway
        run: |
          go test -race ./...
          go vet ./...
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test TTS Gateway
        working-directory: tts-gateway
        run: |
          pip install -r requirements.txt
          pytest -v
      - name: Test failover controller
        run: |
          python3 -m pip install pytest
          python3 -m py_compile platform/failover/vps-failover-controller.py
          python3 -m pytest -q platform/failover/test_failover.py
      - name: Verify GitHub Actions are pinned to full commit SHAs
        run: bash scripts/verify-actions-pinned.sh
      - name: Test component promotion scope classifier
        run: bash scripts/test-promotion-scope.sh
      - name: Test promotion dispatcher and rollout orchestration
        run: bash deploy/tests/test_promotion_dispatcher.sh
      - name: Verify CI workflow timeouts, keepalives, and action pinning
        run: bash deploy/tests/test_ci_workflow.sh
      - name: Test health endpoints, telemetry and operational alerts
        run: bash deploy/tests/test_health_telemetry.sh
      - name: Run deployment failure drill tests
        run: |
          bash deploy/tests/test_secrets.sh
          bash deploy/tests/test_backup.sh
          bash deploy/tests/test_restore_drill.sh
          bash deploy/tests/test_compose_policy.sh
          bash deploy/tests/test_runtime_policy.sh
          bash deploy/tests/test_gateway_deploy.sh
          bash deploy/tests/test_schema_deploy.sh
          bash deploy/tests/test_worker_deploy.sh
          bash deploy/tests/test_aux_deploy.sh
          bash deploy/tests/test_traefik_switch.sh
      - name: Verify deployment and platform script syntax
        run: |
          shopt -s nullglob
          scripts=(deploy/*.sh scripts/*.sh scripts/ops/*.sh deploy/tests/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
      - name: Lint deployment and platform scripts
        run: |
          shopt -s nullglob
          scripts=(deploy/*.sh scripts/*.sh scripts/ops/*.sh)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found" >&2
            exit 1
          fi
          shellcheck --severity=error "${scripts[@]}"
      - name: Verify architecture documentation
        run: bash scripts/verify-architecture-docs.sh
      - name: Test supply-chain validators and release manifest
        run: bash deploy/test-supply-chain.sh
      - name: Check generated source and whitespace
        run: git diff --check

  docker-smoke-gateway:
    name: Docker smoke test (gateway)
    timeout-minutes: 10
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          target: gateway
          push: false
          tags: acb-transaction-webhook:smoke-test
          load: true
      - name: Run gateway image smoke test
        run: |
          docker run -d --name smoke-test \
            -e APP_ENV=development \
            -e LISTEN_ADDR=0.0.0.0:8080 \
            -e DATA_DIR=/tmp/data \
            acb-transaction-webhook:smoke-test
          sleep 2
          docker exec smoke-test /gateway --healthcheck
          docker stop smoke-test
          docker rm -f smoke-test

  docker-smoke-auth-browser:
    name: Docker smoke test (auth-browser)
    timeout-minutes: 10
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          file: Dockerfile.auth-browser
          push: false
          tags: acb-transaction-webhook-auth-browser:smoke-test
          load: true
      - name: Run auth-browser image smoke test
        run: |
          chmod +x deploy/smoke-test-auth-browser.sh
          ./deploy/smoke-test-auth-browser.sh acb-transaction-webhook-auth-browser:smoke-test

  docker-smoke-tts-gateway:
    name: Docker smoke test (tts-gateway)
    timeout-minutes: 10
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: ./tts-gateway
          push: false
          tags: acb-tts-gateway:smoke-test
          load: true
      - name: Run tts-gateway image smoke test
        run: |
          docker run -d --name smoke-test-tts \
            -e TTS_PORT=8081 \
            acb-tts-gateway:smoke-test
          sleep 3
          docker exec smoke-test-tts curl -f http://127.0.0.1:8081/health
          docker stop smoke-test-tts
          docker rm -f smoke-test-tts
